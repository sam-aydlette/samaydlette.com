<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">samaydlette.com: a terminal prompt, waiting</title>
  <!-- Derived from the site header's mark, "> Sam Aydlette": the blue prompt
       (color-blue-400) and the amber name (logo-color, dark theme), reduced
       to the prompt and a block cursor on the site's terminal background. -->
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1f242b"/>
      <stop offset="0.55" stop-color="#121519"/>
      <stop offset="1" stop-color="#0a0c0e"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bloom">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* The cursor blinks like a terminal's, unless the viewer asked for less motion. */
      @media (prefers-reduced-motion: no-preference) {
        .cursor { animation: blink 1.1s steps(1, end) infinite; }
      }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.18; } }
    </style>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- phosphor bloom behind the cursor -->
    <circle cx="326" cy="270" r="230" fill="url(#bloom)"/>
    <rect width="512" height="512" fill="url(#scan)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2b3138" stroke-width="12"/>
  <!-- the prompt -->
  <polyline points="112,150 212,256 112,362" fill="none" stroke="url(#blue)"
            stroke-width="50" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- the cursor -->
  <rect class="cursor" x="262" y="166" width="128" height="196" rx="14" fill="url(#amber)" filter="url(#glow)"/>
  <!-- a signed baseline: the evidence under the prompt -->
  <rect x="112" y="398" width="278" height="16" rx="8" fill="#34d399" opacity="0.85"/>
</svg>
