# =============================================================================
# SCN EVALUATION GATE  (SCN-CSO-EVA)
# =============================================================================
# Every change carries an explicit significant-change evaluation: an SCN-Type
# line, a one-line SCN-Rationale and, for adaptive, transformative and emergency
# changes, the SCN-Record it will be documented in. The pull request's
# description is read on pull_request events; on a push to main, the merged
# pull request's description (or the commit message for a direct push).
#
# There is no default. A missing type, a missing or placeholder rationale, or an
# unrecognized value fails. class-change always fails: it is a new
# certification, not a significant change. A transformative change fails until
# its initial and final plans have been published 30 and 10 business days
# (SCN-TRF-NIP/NFP). The rules live in scripts/_scn.py and are unit-tested in
# tests/test_scn.py; the deploy writes every merged evaluation to the
# append-only log at /.well-known/scn-evaluations.json (SCN-CSO-MAR).
# =============================================================================

name: SCN Tag

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  scn-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Untrusted text (a PR description, a commit message) reaches the script
      # only through the environment, never by ${{ }} interpolation into shell.
      - name: Validate the SCN evaluation
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            SCN_TEXT="${PR_BODY:-}"
            source_label="PR description"
          else
            SCN_TEXT="${COMMIT_MSG:-}"
            source_label="commit message"
            pr=$(printf '%s\n' "${SCN_TEXT}" | head -n1 | sed -nE 's/^Merge pull request #([0-9]+) from .*/\1/p')
            if [ -n "${pr}" ]; then
              SCN_TEXT=$(gh api "repos/${REPO}/pulls/${pr}" --jq '.body // ""')
              source_label="description of merged PR #${pr}"
            fi
          fi
          export SCN_TEXT
          python3 scripts/scn-evaluate.py --text-env SCN_TEXT --source "${source_label}"
