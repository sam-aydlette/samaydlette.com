# =============================================================================
# SIMULATED ASSESSOR — "Totally Real Assessment Services, LLC (simulated)"
# =============================================================================
# SIMULATED. Not independent of the provider, not a FedRAMP Recognized
# independent assessment service, no FedRAMP assessor ID. It stands in for an
# assessor so the assessor port (IVV-CSO-FIA/ICP, IVV-CSX-AIA, CPO-CSO-OSA,
# SDR-CSO-FRR) is exercised end to end on every deploy.
#
# The deploy calls this as a reusable workflow before its deploy job. Because it
# is a reusable workflow, the Sigstore certificate that signs its record names
# THIS file (job_workflow_ref), not deploy-with-opa.yml: the assessor signs
# under its own identity, which infrastructure/keys/assessor-identity.json pins.
# It holds no AWS credentials and reads only public URLs and the repository.
#
# It follows the provider's assessor guide (scripts/build-assessor-guide.py):
# re-runs every test a rule record cites, finds every cited workflow step and
# decision, fetches every cited published artifact and verifies its signature
# and age, and checks every KSI against the live, verified KSI signal. Then it
# writes one signed set: a result per rule, per KSI, and an overall summary.
# Any failure fails this job, and the deploy job needs it.
# =============================================================================
name: Simulated assessor (not a FedRAMP assessment)

on:
  workflow_call:

permissions: {}

env:
  # Kept equal to deploy-with-opa.yml's pins by tests/test_simulated_assessor.py.
  OPA_VERSION: 1.18.2
  OPA_SHA256: 9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8

jobs:
  assess:
    name: Totally Real Assessment Services, LLC (simulated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No id-token here: this job installs unpinned test tooling from PyPI and
    # runs the provider's tests, so it must not be able to sign. The signing
    # job below installs nothing but cosign.
    permissions:
      contents: read
    steps:
    - name: Checkout the commit under assessment
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the assessor's tools
      run: |
        python3 -m pip install --user pytest jsonschema pyyaml cryptography
        curl -fL --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 120 \
          -o opa "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
        echo "${OPA_SHA256}  opa" | sha256sum -c -
        chmod 755 ./opa
        sudo mv opa /usr/local/bin

    # IVV-CSO-STE: the provider supplies the technical explanation (the guide);
    # the assessor works from it.
    - name: Receive the provider's assessor guide
      run: python3 scripts/build-assessor-guide.py --commit "$GITHUB_SHA" --output assessor-guide.json --md-output assessor-guide.md

    - name: Assess every rule and KSI (verification and validation)
      run: python3 tools/simulated-assessor/assess.py --guide assessor-guide.json --repo . --commit "$GITHUB_SHA" --output simulated-assessment.json

    - name: Pass the unsigned assessment to the signing job
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: simulated-assessment-unsigned
        path: simulated-assessment.json
        if-no-files-found: error

  sign:
    name: Totally Real Assessment Services, LLC (simulated) signs
    needs: [assess]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # keyless signing under this workflow's own identity
    steps:
    - name: Checkout the pinned assessor identity
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Receive the unsigned assessment
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: simulated-assessment-unsigned

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    - name: Sign the assessment (keyless, the assessor's own identity)
      run: cosign sign-blob --yes --new-bundle-format --bundle simulated-assessment.bundle simulated-assessment.json

    - name: Verify the assessment signature against the pinned assessor identity
      run: |
        id=$(python3 -c 'import json; print(json.load(open("infrastructure/keys/assessor-identity.json"))["certificate_identity"])')
        cosign verify-blob --bundle simulated-assessment.bundle \
          --certificate-identity "$id" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com simulated-assessment.json

    - name: Hand the signed assessment to the provider
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: simulated-assessment
        path: |
          simulated-assessment.json
          simulated-assessment.bundle
        if-no-files-found: error
