# =============================================================================
# GitHub Actions Workflow: Evidence Nightly (VDR refresh)
# =============================================================================
# Published compliance reporting must be less than 24 hours old. That was policy
# and nothing else: the freshness of the SERVED artifacts was never asserted
# anywhere, so when the nightly deploy began failing on a vulnerability the gate
# was right to block, the published VDR simply stopped moving. Twelve days, every
# gate green, nobody told.
#
# The deploy path cannot be the answer. It is bound to the `prod` GitHub
# Environment behind a human reviewer (deliberately — it applies Terraform over
# the whole stack), so it cannot refresh anything unattended.
#
# So this workflow does the one thing that genuinely needs a daily cadence and
# needs no infrastructure change at all: re-run the dependency scan against a
# freshly-pulled Grype database, rebuild the VDR and its trend ledger, put them
# through the same vulnerability and reconciliation gates, and republish exactly
# those five objects. No Terraform apply. No website sync. No write outside
# `.well-known/vdr-*`. One more object in that prefix, vdr-status.json, is a
# status beacon written on every run, pass or fail, for the evidence SLA
# watchdog (infrastructure/watchdog.tf). It carries outcomes, not evidence.
#
# THE TRADE, STATED PLAINLY: this replaces an unattended Terraform apply over
# the whole stack with an unattended write to one S3 prefix. Narrower, but still
# an unattended production write, and its GitHub Environment deliberately has no
# required reviewer because it must run while nobody is awake. See CLAUDE.md.
#
# WHAT THIS DOES NOT REFRESH, and why that is safe:
#   - The canonical inventory. This binds to the PUBLISHED ksi-signal.json
#     (signature-verified against the deploy workflow's pinned identity) rather
#     than rebuilding it, which is what satisfies reconciliation invariant (e)
#     without touching the SDR/CPO/IIW. A changed inventory means changed
#     infrastructure, and that belongs on the reviewed deploy path.
#   - The OPA gate axis. `validations.json` is produced by `terraform plan`,
#     which this workflow has neither the state access nor the IAM rights to run.
#     Empirically that axis contributes zero findings to any PUBLISHED VDR — a
#     VDR with OPA violations in it could never publish, because the deploy gate
#     blocks the deploy first. So its absence changes no published value. It does
#     mean the nightly VDR is an SAST+SCA+DAST report re-verified against today's
#     threat data, not a re-evaluation of the infrastructure plan.
#   - The SDR, CPO, IIW, OCR, CDS and provenance attestations. The published
#     SDR and CPO are fetched and signature-verified here, but only as inputs to
#     the reconciliation gate; they are never re-signed or re-published.
#
# A GENUINELY NEW CVE CANNOT AUTO-PUBLISH. Invariant (h) requires every VDR
# finding to carry a decision_id that resolves to an in-force record in the
# decision register (data/decisions.json), a human-authored git file. A new
# finding therefore breaks this workflow until a human records a decision. That is the gate working, and it is
# exactly why the alert job below has to be reliable.
# =============================================================================

name: Evidence Nightly (VDR refresh)

on:
  # The cadence the deploy workflow used to carry. Moved here so the only thing
  # that runs unattended is this narrow refresh, and every path that can reach
  # Terraform apply stays behind the `prod` reviewer gate.
  #
  # Twice a day, not once. GitHub fires scheduled runs late and irregularly (the
  # 07:17 run has started as late as ~12:40), so with one run a day the VDR
  # sits right at 24 hours old before the next one, and the watchdog's 24-hour
  # alarm would page on a late cron rather than a real miss. Two runs keep the
  # VDR well inside the policy, so the alarm fires only when runs actually fail.
  schedule:
    - cron: '17 7 * * *'
    - cron: '17 19 * * *'
  workflow_dispatch:
  # And once more after every deploy to main. A deploy runs the same gates and
  # republishes the VDR, but it does not write the status beacon, so a nightly
  # that failed before a fix was deployed kept reporting "failure" on the trust
  # center and holding the watchdog's nightly-failed alarm until the next cron
  # (up to 12 hours). Running the refresh right after the deploy makes the
  # beacon say what is true now. This adds a trigger, not a permission: the run
  # uses this file from main, the same role and the same environment, and the
  # `sast` job's condition drops every deploy run that did not succeed or came
  # from a pull request. The `branches` filter alone is not enough, because a
  # pull request from a fork whose branch is named `main` would pass it; the
  # event check closes that.
  workflow_run:
    workflows: [Deploy Website with OPA Compliance]
    types: [completed]
    branches: [main]

# Never let two refreshes race for the same five objects.
concurrency:
  group: evidence-nightly
  cancel-in-progress: false

# Default-deny at the workflow level; each job widens only what it needs.
permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  NODE_VERSION: 22
  # Same pinned Anchore toolchain as the deploy path, so the nightly scan and the
  # deploy scan inventory the same trees the same way. Refresh together with
  # deploy-with-opa.yml or the two VDRs will disagree for tooling reasons.
  SYFT_VERSION: v1.45.1
  GRYPE_VERSION: v0.114.0
  # The VDR's decisions are made by policies/triage.rego, so the nightly runs the
  # same OPA as the deploy. Refresh together with deploy-with-opa.yml;
  # tests/test_triage_policy.py fails if the two pins differ.
  OPA_VERSION: 1.18.2
  OPA_SHA256: 9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8
  # The site bucket. Resolved as a literal rather than `terraform output` on
  # purpose: reading a Terraform output needs backend state access and a role
  # that can init the stack, which is exactly the blast radius this workflow
  # exists to avoid. The value is the same literal the deploy job writes into
  # terraform.tfvars as `existing_s3_bucket_name`.
  SITE_BUCKET: samaydlette.com
  SITE_ORIGIN: https://samaydlette.com
  # The published-freshness windows live in one governed place,
  # infrastructure/schemas/freshness-config.json (REQ-PUB-2); the freshness
  # check below reads its window from there, not from this workflow.
  # The identity that signs the published inventory. The nightly binds its VDR to
  # an artifact it fetched over the public internet, so it verifies that artifact
  # against this pinned identity before trusting a single byte of it.
  DEPLOY_SIGNER_IDENTITY: 'https://github.com/sam-aydlette/samaydlette.com/.github/workflows/deploy-with-opa.yml@refs/heads/main'
  COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # ===========================================================================
  # JOB 1: SAST — the IaC scan axis, credential-free
  # ===========================================================================
  # Checkov and tfsec are pure static analysis over the Terraform source. They
  # need no AWS access at all, which is why they can run in an unprivileged job
  # here rather than being inherited from the deploy path.
  #
  # They are NOT optional. The published VDR carries 31 Checkov and 6 tfsec
  # findings; a nightly that skipped them would republish a report asserting
  # those findings had disappeared. Same scanners, same pins, same soft-fail
  # posture as the deploy workflow's security-scan job — the VDR aggregator and
  # the vulnerability gate are what decide, not the scanners.
  # ===========================================================================
  sast:
    name: SAST (Checkov + tfsec)
    # Every other job needs this one, so a skip here skips the whole run.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # tfsec (end of life) cannot parse Terraform import blocks and aborts the
    # whole scan on them, which would drop every tfsec finding from the VDR.
    # They live only in infrastructure/imports.tf (one-time adoptions, no
    # security-relevant configuration); this job's checkout is scan-only, so
    # removing the file here changes nothing that is planned or applied.
    - name: Hide import blocks from tfsec
      run: rm -f infrastructure/imports.tf

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
      with:
        # Authenticate the action's "resolve latest tfsec release" GitHub API
        # call — anonymous requests get rate-limited on shared runners.
        github_token: ${{ secrets.GITHUB_TOKEN }}
        soft_fail: true
        additional_args: --format json --out tfsec-results.json

    - name: Run Checkov
      uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
      with:
        directory: .
        framework: terraform
        soft_fail: true
        output_format: sarif
        output_file_path: checkov-out

    # Copies the SARIF to a predictable path. A scanner that produced nothing
    # leaves no file: no empty stand-in is written, so the detection gate (G7)
    # in the refresh job fails the run rather than publishing "no findings".
    - name: Locate SARIF and tfsec files
      if: always()
      run: |
        SARIF_FOUND=$(find checkov-out -name "*.sarif" -type f 2>/dev/null | head -n1 || true)
        if [ -n "$SARIF_FOUND" ]; then
          cp "$SARIF_FOUND" checkov-results.sarif
          echo "Located Checkov SARIF at $SARIF_FOUND ($(wc -c < checkov-results.sarif) bytes)"
        else
          echo "::warning::No SARIF produced by Checkov; the detection gate will fail the run."
        fi
        if [ -f tfsec-results.json ]; then
          echo "tfsec JSON size: $(wc -c < tfsec-results.json) bytes"
        else
          echo "::warning::No tfsec output; the detection gate will fail the run."
        fi

    - name: Upload SAST artifacts for VDR aggregation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: nightly-sast-results
        path: |
          checkov-results.sarif
          tfsec-results.json
        retention-days: 5

  # ===========================================================================
  # JOB 2: REFRESH — rebuild, gate, and republish the VDR + trend
  # ===========================================================================
  refresh:
    name: Refresh published VDR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [sast]
    # Its own GitHub Environment, with NO required reviewer, because it must run
    # unattended. This is the trade named at the top of this file. The `prod`
    # environment and its reviewer requirement are untouched, and the role this
    # environment's OIDC subject can assume cannot apply Terraform, cannot sync
    # the website, and cannot write outside `.well-known/vdr-*`.
    environment: evidence-nightly
    # Detect-and-recover gate events (infrastructure/schemas/gate-modes.json) are
    # appended here by scripts/_gates.py and published with this run's evidence.
    env:
      GATE_EVENTS_FILE: /tmp/gate-events.jsonl
    # Which gate stopped the run, handed to the alert job. A failed vulnerability
    # gate and a skipped reconciliation are different problems: the first means
    # stale evidence, the second means nothing compared the live site against its
    # documentation. The alert has to be able to say which.
    outputs:
      vuln_gate: ${{ steps.vulngate.outcome }}
      vuln_findings: ${{ steps.vulngate.outputs.findings }}
      detection: ${{ steps.detection.outcome }}
      reconcile: ${{ steps.reconcile.outcome }}
    permissions:
      contents: read
      # Sigstore keyless signing via the GitHub Actions OIDC provider, and the
      # AWS role assumption. No AWS long-lived key.
      id-token: write
      # Lets GITHUB_TOKEN download the ZAP DAST artifacts (actions) and read
      # the CodeQL code-scanning alerts (security-events). Dependabot alerts are
      # read with the DEPENDABOT_ALERTS_TOKEN secret: GITHUB_TOKEN cannot.
      actions: read
      security-events: read

    steps:
    # -------------------------------------------------------------------------
    # SETUP
    # -------------------------------------------------------------------------
    # Full history: the published inventory names the commit it was built from,
    # and this workflow refuses to bind to an inventory whose commit is not an
    # ancestor of main. That ancestry test needs more than a shallow clone.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: infrastructure/lambda/package-lock.json

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    - name: Download SAST results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nightly-sast-results
        path: infrastructure/

    - name: Configure AWS credentials
      id: awscreds
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      # The OIDC AssumeRoleWithWebIdentity call to regional STS intermittently
      # times out from GitHub runners; cap it and retry rather than hanging.
      timeout-minutes: 6
      with:
        # A dedicated least-privilege role, NOT the deploy role. Its ARN is a
        # repo variable so the account id stays out of this file.
        # Defined in infrastructure/bootstrap/evidence-nightly.tf.
        role-to-assume: ${{ vars.AWS_EVIDENCE_NIGHTLY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        retry-max-attempts: 5

    # -------------------------------------------------------------------------
    # BIND TO THE PUBLISHED CANONICAL INVENTORY
    # -------------------------------------------------------------------------
    # This is the step that makes a VDR-only refresh legitimate. Reconciliation
    # invariant (e) requires every artifact to carry one inventory's signal_id.
    # Rather than rebuild the inventory (which would mean rebuilding and
    # republishing everything derived from it), the nightly adopts the inventory
    # that is currently published and deployed.
    #
    # That inventory arrives over the public internet, so it is verified before
    # use: the Sigstore bundle must check out against the deploy workflow's
    # pinned identity. Fail closed — an unverifiable inventory is not an
    # inventory, and binding a signed VDR to one would launder a forgery.
    - name: Fetch and verify the published canonical inventory
      working-directory: infrastructure
      run: |
        set -euo pipefail
        curl -sfL --retry 3 --retry-delay 5 -o ksi-signal.json \
          "${SITE_ORIGIN}/.well-known/ksi-signal.json"
        curl -sfL --retry 3 --retry-delay 5 -o ksi-signal.bundle \
          "${SITE_ORIGIN}/.well-known/ksi-signal.bundle"
        echo "Verifying the published inventory against the deploy workflow's pinned identity..."
        cosign verify-blob \
          --bundle ksi-signal.bundle \
          --certificate-identity "${DEPLOY_SIGNER_IDENTITY}" \
          --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
          ksi-signal.json
        SIGNAL_COMMIT=$(jq -r '.provenance.source.commit' ksi-signal.json)
        SIGNAL_ID=$(jq -r '.signal_id' ksi-signal.json)
        # The value is already trusted (the signature above verified it), but it
        # is about to become a shell variable and an environment-file line, so
        # constrain it to the only shape it can legitimately have. A value
        # carrying a newline could otherwise append arbitrary variables to
        # $GITHUB_ENV.
        if ! printf '%s' "$SIGNAL_COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error::published inventory carries a malformed commit id"
          exit 1
        fi
        echo "Published inventory ${SIGNAL_ID} was built from commit ${SIGNAL_COMMIT}"
        echo "SIGNAL_COMMIT=${SIGNAL_COMMIT}" >> "$GITHUB_ENV"

    # The published inventory must descend from main. If it does not, something
    # is serving evidence this repository did not produce, and the correct
    # response is to stop rather than to sign a fresh VDR on top of it.
    - name: Assert the published inventory descends from main
      run: |
        set -euo pipefail
        if ! git cat-file -e "${SIGNAL_COMMIT}^{commit}" 2>/dev/null; then
          echo "::error::published inventory names commit ${SIGNAL_COMMIT}, which is not in this repository"
          exit 1
        fi
        # Compare against a freshly fetched main rather than a remote-tracking
        # ref, so the test means the same thing however this run was triggered.
        git fetch --no-tags --quiet origin main
        if ! git merge-base --is-ancestor "${SIGNAL_COMMIT}" FETCH_HEAD; then
          echo "::error::published inventory commit ${SIGNAL_COMMIT} is not an ancestor of main"
          exit 1
        fi
        echo "✅ published inventory commit is on main"

    # -------------------------------------------------------------------------
    # RESOLVE THE DEPENDENCY TREES THE SCAN INVENTORIES
    # -------------------------------------------------------------------------
    # Three trees, exactly the ones the deploy job scans:
    #   _pkg               Silk Reeling's Python deps (Lambda staging dir)
    #   _silk_src/frontend Silk Reeling's SPA — manifests live in a separate
    #                      repo, so Dependabot never sees them and this scan is
    #                      their only CVE coverage
    #   lambda             the compliance Lambda's own npm tree
    # plus ../tools/a11y, catalogued straight from its lockfile.
    #
    # DELIBERATE DIVERGENCE FROM THE DEPLOY BUILD: this resolves the dependency
    # trees but does not run the SPA's `npm run build`, does not stage the
    # backend sources, and does not produce silk-reeling.zip — none of which the
    # Syft catalogers read. The scanned component set is identical; the work that
    # only exists to produce a deployable artifact is skipped, along with the
    # Cognito lookups that only feed build-time SPA config. If the deploy job's
    # build step changes what lands in these trees, change this one with it.
    - name: Install compliance Lambda dependencies
      working-directory: infrastructure/lambda
      run: npm ci --omit=dev

    - name: Resolve Silk Reeling dependency trees (scan input only)
      working-directory: infrastructure
      env:
        SILK_REELING_REF: ${{ vars.SILK_REELING_REF || 'main' }}
        SILK_REELING_REPO_TOKEN: ${{ secrets.SILK_REELING_REPO_TOKEN }}
      run: |
        set -euo pipefail
        rm -rf _silk_src _pkg
        git clone --depth 1 --branch "$SILK_REELING_REF" \
          "https://x-access-token:${SILK_REELING_REPO_TOKEN}@github.com/sam-aydlette/silk-reeling-mirror.git" _silk_src
        ( cd _silk_src/frontend && npm ci )
        mkdir -p _pkg
        # Same platform pins as the deploy build so the resolved wheel set — and
        # therefore the CVE match set — is the runtime's, not the runner's.
        python3 -m pip install --quiet --target _pkg \
          --platform manylinux2014_x86_64 --python-version 3.13 \
          --implementation cp --only-binary=:all: \
          -r _silk_src/backend/requirements-lambda.txt

    # -------------------------------------------------------------------------
    # THE POINT OF THE NIGHTLY: re-scan against today's vulnerability database
    # -------------------------------------------------------------------------
    # Byte-for-byte the deploy job's scan step. Grype pulls a fresh database on
    # every run, so this catches CVEs newly disclosed against unchanged,
    # already-deployed dependencies — the detection that has been dark for the
    # twelve days the deploy could not complete.
    - name: Scan application and Lambda dependencies (Syft SBOM + Grype)
      working-directory: infrastructure
      run: |
        set +e   # neither findings nor a failed scan fail this step: the detection gate and the VDR gate do
        curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
          | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
        curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
          | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"
        syft version && grype version
        syft dir:_pkg               -o cyclonedx-json=sbom-python.json --select-catalogers python
        syft dir:_silk_src/frontend -o cyclonedx-json=sbom-js.json     --select-catalogers javascript
        syft dir:lambda             -o cyclonedx-json=sbom-lambda.json --select-catalogers javascript
        syft dir:../tools/a11y      -o cyclonedx-json=sbom-a11y.json   --select-catalogers javascript
        grype sbom:sbom-python.json -o json > grype-python.json
        grype sbom:sbom-js.json     -o json > grype-js.json
        grype sbom:sbom-lambda.json -o json > grype-lambda.json
        grype sbom:sbom-a11y.json   -o json > grype-a11y.json
        # No empty stand-ins: a scan that failed leaves its file missing or
        # without .matches, and the detection gate (G7) checks each per-tree
        # file, including the database age Grype reports in it.
        if jq -s '{matches: (map(.matches) | add)}' \
            grype-python.json grype-js.json grype-lambda.json grype-a11y.json > grype.json 2>/dev/null; then
          echo "grype.json: $(jq '.matches | length' grype.json) match(es)"
        else
          rm -f grype.json
          echo "::warning::At least one Grype scan did not complete; the detection gate will fail the run."
        fi

    # -------------------------------------------------------------------------
    # DETECTION INPUTS AND G7
    # -------------------------------------------------------------------------
    # The previous VDR, Dependabot alerts, the CISA KEV catalog, FIRST EPSS and
    # the latest DAST reports and CodeQL alerts. A failed fetch leaves <file>.error, never
    # an empty stand-in; the detection gate below fails the run on it (T52).
    - name: Fetch detection feeds
      working-directory: infrastructure
      env:
        DEPENDABOT_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash ../scripts/fetch-detection-feeds.sh

    - name: Detection gate (G7)
      id: detection
      working-directory: infrastructure
      run: |
        python3 ../scripts/detection-gate.py \
          --kev kev-catalog.json --epss epss-scores.csv.gz \
          --grype grype-python.json grype-js.json grype-lambda.json grype-a11y.json \
          --dependabot dependabot-alerts.json --previous-vdr previous-vdr-report.json \
          --checkov checkov-results.sarif --tfsec tfsec-results.json \
          --codeql codeql-alerts.json --zap-api zap-api-report.json \
          --output detection.json

    # -------------------------------------------------------------------------
    # GATE INPUTS — built, never signed, never published
    # -------------------------------------------------------------------------
    # scripts/reconcile.py loads the signal, VDR, SDR and CPO and reads the
    # decision register from the checkout. The SDR and CPO are the ones the last
    # reviewed deploy published with this inventory (or the daily package
    # maintainer rebuilt from it); they arrive over the public internet, so each
    # is verified against one of those two pinned identities before use, exactly like the inventory above. Fail closed: an unverifiable
    # artifact is not evidence. They are not re-signed or re-published here.
    - name: Fetch and verify the published SDR and CPO (reconciliation inputs)
      working-directory: infrastructure
      run: |
        set -euo pipefail
        # Signed by the deploy, or by the daily package maintainer that rebuilds
        # them at the deployed commit (package-maintenance.yml, CPO-CSX-CPM).
        MAINTAINER_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/package-maintenance.yml@refs/heads/main"
        for art in security-decision-record certification-package-overview; do
          curl -sfL --retry 3 --retry-delay 5 -o "$art.json" "${SITE_ORIGIN}/.well-known/$art.json"
          curl -sfL --retry 3 --retry-delay 5 -o "$art.bundle" "${SITE_ORIGIN}/.well-known/$art.bundle"
          cosign verify-blob \
            --bundle "$art.bundle" \
            --certificate-identity "${DEPLOY_SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            "$art.json" \
          || cosign verify-blob \
            --bundle "$art.bundle" \
            --certificate-identity "${MAINTAINER_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            "$art.json"
        done

    # The signed runtime signal is the only live read a mitigation can cite
    # (rule 1: a mitigation verified by a live read makes a finding fully
    # mitigated). The builder verifies its signature against
    # infrastructure/keys/runtime-signing-key.json and its age; anything short
    # of verified and fresh voids every mitigation that needs a live read, so a
    # failed fetch can only keep findings open, never close them.
    - name: Fetch the signed runtime signal (live read for mitigations)
      working-directory: infrastructure
      run: |
        if curl -sfL --retry 3 --retry-delay 2 -o ksi-signal-runtime.json \
            "https://samaydlette.com/.well-known/ksi-signal-runtime.json"; then
          echo "Runtime signal fetched: emitted $(jq -r '.emitted_at' ksi-signal-runtime.json 2>/dev/null || echo 'unreadable; the builder will reject it')"
        else
          echo "::warning::Could not fetch the runtime signal; mitigations that need a live read are void this run."
          rm -f ksi-signal-runtime.json
        fi

    # REQ-GOV-2: the VDR names the conformance results of the profile it was
    # built under: the ones the last deploy signed and published, verified
    # against the deploy's identity like the inventory above.
    - name: Fetch and verify the published conformance results
      working-directory: infrastructure
      run: |
        set -euo pipefail
        curl -sfL --retry 3 --retry-delay 5 -o conformance-results.json "${SITE_ORIGIN}/.well-known/conformance-results.json"
        curl -sfL --retry 3 --retry-delay 5 -o conformance-results.bundle "${SITE_ORIGIN}/.well-known/conformance-results.bundle"
        cosign verify-blob --bundle conformance-results.bundle \
          --certificate-identity "${DEPLOY_SIGNER_IDENTITY}" \
          --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" conformance-results.json
        jq -c '{profile_version, summary}' conformance-results.json

    # The builder evaluates policies/triage.rego for every decision and fails
    # closed without opa. Same version and SHA pin as the deploy job.
    - name: Setup OPA (triage policy)
      run: |
        curl -fL --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 120 \
          -o opa "https://openpolicyagent.org/downloads/v${{ env.OPA_VERSION }}/opa_linux_amd64_static"
        echo "${{ env.OPA_SHA256 }}  opa" | sha256sum -c -
        chmod 755 ./opa
        sudo mv opa /usr/local/bin
        opa version

    # -------------------------------------------------------------------------
    # BUILD THE VDR
    # -------------------------------------------------------------------------
    # --ksi-signal binds the report to the published inventory (invariant e).
    # --opa is deliberately not passed; see the header. Its absence leaves the
    # builder's default path pointing at a file that does not exist, which
    # ingest_opa treats as an empty finding set.
    # VDR-CSO-FAV: runs of the pipeline that a block-mode check stopped. The
    # next report lists each one (no run IDs or URLs are kept). A failed query
    # fails the step: no list cannot read as "no failures".
    - name: Collect failed pipeline runs (VDR-CSO-FAV)
      working-directory: infrastructure
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh run list --repo "${{ github.repository }}" --branch main --status failure --limit 100 \
          --json workflowName,createdAt,updatedAt,event,headBranch > failed-runs.json
        jq length failed-runs.json

    - name: Build VDR Report (FedRAMP 20x Class C)
      id: vdr
      working-directory: infrastructure
      run: |
        set -euo pipefail
        python3 ../scripts/build-vdr-report.py \
          --checkov checkov-results.sarif \
          --tfsec tfsec-results.json \
          --checkov-yaml ../.checkov.yaml \
          --previous-vdr previous-vdr-report.json \
          --dependabot dependabot-alerts.json \
          --grype grype.json \
          --zap zap-report.json \
          --zap-max-age-days 3 \
          --zap-api zap-api-report.json \
          --codeql codeql-alerts.json \
          --kev kev-catalog.json \
          --epss epss-scores.csv.gz \
          --detection detection.json \
          --conformance conformance-results.json \
          --ksi-signal ksi-signal.json \
          --runtime-signal ksi-signal-runtime.json \
          --failed-runs failed-runs.json \
          --output vdr-report.json
        jq '{summary, risk_accepted_count: (.risk_accepted | length)}' vdr-report.json

    # Unchanged gate, new schedule. Fails the build on any scanner-reported
    # vulnerability that is not remediated or dispositioned false-positive /
    # operational-requirement in data/decisions.json. When a newly
    # disclosed CVE lands, THIS is what stops it publishing, and the alert job
    # is what tells a human to disposition it.
    #
    # The ids the gate names are exported as a JSON list so the alert can put
    # each one in front of a person with its advisory and any open Dependabot
    # PR. The gate's own exit status is what fails the step; capturing its
    # output changes nothing about what passes.
    - name: Vulnerability gate (fix or categorize every vuln)
      id: vulngate
      working-directory: infrastructure
      run: |
        set +e
        python3 ../scripts/vuln-gate.py --vdr vdr-report.json --register ../data/decisions.json > vuln-gate.out 2>&1
        rc=$?
        set -e
        cat vuln-gate.out
        findings=$(sed -n 's/^  ✗ \([^ ]*\) .*/\1/p' vuln-gate.out | jq -Rsc 'split("\n") | map(select(length > 0))')
        echo "findings=${findings}" >> "$GITHUB_OUTPUT"
        exit "$rc"

    - name: Build VDR vuln trend ledger (RA-5(6))
      working-directory: infrastructure
      run: |
        set -euo pipefail
        if curl -sfL -o vdr-trend.json "${SITE_ORIGIN}/.well-known/vdr-trend.json"; then
          echo "Previous trend ledger fetched ($(jq '.points | length' vdr-trend.json) points)."
        else
          echo "::warning::No previous VDR trend ledger; starting a fresh one."
          rm -f vdr-trend.json
        fi
        python3 ../scripts/backfill-vdr-trend.py \
          --points ../data/vdr-trend-backfill.json --trend vdr-trend.json
        python3 ../scripts/build-vdr-trend.py --report vdr-report.json --trend vdr-trend.json

    # -------------------------------------------------------------------------
    # THE GATE — unchanged assertions, fail closed
    # -------------------------------------------------------------------------
    # --expect-commit is the PUBLISHED inventory's commit, not this run's HEAD.
    # Invariant (f) asks whether the artifacts under evaluation agree on one
    # commit; for a refresh that deliberately adopts the deployed inventory, that
    # commit is the deployed one. HEAD is asserted separately, and more strongly,
    # by the ancestry check above. Freshness — the thing (f) never measured — is
    # asserted against the live edge after publish.
    #
    # --live enumerates live AWS for invariants (a) completeness and (i)
    # classification tags. Those are the only AWS reads this workflow's role can
    # perform, and they are read-only.
    #
    # Runs even when the vulnerability gate above has failed. The two gates
    # answer different questions, and this one used to sit behind the other: from
    # 2026-09-09 to 2026-09-24 an undispositioned CVE failed the vulnerability
    # gate every night, so the live drift check never ran and nothing said so.
    # Running it anyway does not weaken either gate. The job still fails, and
    # every sign and publish step below keeps its default success() condition, so
    # nothing is published unless BOTH gates pass. It only needs its inputs: the
    # VDR (which exists whenever the VDR step succeeded) and the verified SDR and
    # CPO fetched above.
    - name: Reconciliation gate (fail closed on drift)
      id: reconcile
      if: ${{ !cancelled() && steps.vdr.outcome == 'success' }}
      working-directory: infrastructure
      run: |
        # --runtime-signal adds invariant (m): every machine component has an
        # assessed runtime validation under 72h (VDR-TFR-MVX). A runtime signal
        # that failed to fetch was removed above, which fails (m), never skips it.
        python3 ../scripts/reconcile.py --artifacts-dir . --live --expect-commit "${SIGNAL_COMMIT}" \
          --runtime-signal ksi-signal-runtime.json

    # -------------------------------------------------------------------------
    # SIGN — only the artifacts this workflow publishes
    # -------------------------------------------------------------------------
    # Sigstore keyless via the GitHub Actions OIDC provider. Note that these
    # bundles carry THIS workflow's identity, not the deploy workflow's, so a
    # verifier must accept both. scripts/verify-published.sh and the README's
    # verification instructions need the evidence-nightly identity added.
    - name: Sign VDR report and trend ledger
      working-directory: infrastructure
      run: |
        set -euo pipefail
        cosign sign-blob --yes --new-bundle-format --bundle vdr-report.bundle vdr-report.json
        cosign sign-blob --yes --new-bundle-format --bundle vdr-trend.bundle vdr-trend.json
        ls -la vdr-report.bundle vdr-trend.bundle

    # CR26 vulnerability reports (VER-RPT-VDT, VER-RPT-AVI, VER-TFR-MRH), rebuilt
    # from the refreshed VDR report so they never describe a different moment
    # from it. Same step as the deploy's: the previous published copies are read
    # only if they verify against the deploy or this workflow; validated against
    # the vendored FedRAMP schemas before they are written.
    - name: Build and sign CR26 vulnerability reports (VDT, AVI, history)
      working-directory: infrastructure
      run: |
        set -euo pipefail
        prev=()
        for kind in detail-report:vdt accepted-vulnerabilities:avi history:mrh; do
          name="vdr-${kind%%:*}"; flag="--previous-${kind##*:}"
          if curl -sfL --retry 3 --retry-delay 5 -o "previous-$name.json" "${SITE_ORIGIN}/.well-known/$name.json"; then
            curl -sfL --retry 3 --retry-delay 5 -o "previous-$name.bundle" "${SITE_ORIGIN}/.well-known/$name.bundle"
            ok=0
            for identity in "${DEPLOY_SIGNER_IDENTITY}" \
                "https://github.com/${{ github.repository }}/.github/workflows/evidence-nightly.yml@refs/heads/main"; do
              if cosign verify-blob --bundle "previous-$name.bundle" --certificate-identity "$identity" \
                   --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" "previous-$name.json" 2>/dev/null; then ok=1; break; fi
            done
            [ "$ok" -eq 1 ] || { echo "::error::previous $name.json does not verify; refusing to carry it forward"; exit 1; }
            prev+=("$flag" "previous-$name.json")
          else
            echo "No previous $name.json published; its period starts at the earliest detection."
          fi
        done
        python3 ../scripts/build-cr26-vdr.py --vdr vdr-report.json --decisions ../data/decisions.json "${prev[@]}"
        for a in vdr-detail-report vdr-accepted-vulnerabilities vdr-history; do
          cosign sign-blob --yes --new-bundle-format --bundle "$a.bundle" "$a.json"
        done

    # VDR-TFR-NMV: the non-machine V&V status, published with the VDR. Not
    # enforced here (a lapsed quarterly review must not stop the nightly
    # evidence); the deploy enforces it, and the published verifiedAt has a
    # 92-day freshness window, so the watchdog alarms when it lapses.
    - name: Non-machine verification and validation status (VDR-TFR-NMV)
      working-directory: infrastructure
      run: |
        set -euo pipefail
        python3 ../scripts/check-non-machine-vv.py --out vdr-non-machine-vv.json
        cosign sign-blob --yes --new-bundle-format --bundle vdr-non-machine-vv.bundle vdr-non-machine-vv.json

    # VER-TFR-MHR, VER-RPT-HLO, VER-RPT-PER: the month-to-date activity report,
    # in human-readable form, listing every kind of detection and response
    # activity ("none this period" when nothing happened). The previous published
    # report carries the month's earlier runs forward, read only if its signature
    # verifies against this workflow or the other publisher.
    - name: Build monthly VDR activity report (VER-TFR-MHR)
      working-directory: infrastructure
      run: |
        set -euo pipefail
        prev=()
        if curl -sfL --retry 3 --retry-delay 5 -o previous-vdr-monthly.json "${SITE_ORIGIN}/.well-known/vdr-monthly.json"; then
          curl -sfL --retry 3 --retry-delay 5 -o previous-vdr-monthly.bundle "${SITE_ORIGIN}/.well-known/vdr-monthly.bundle"
          ok=0
          for identity in "${DEPLOY_SIGNER_IDENTITY}" \
              "https://github.com/${{ github.repository }}/.github/workflows/evidence-nightly.yml@refs/heads/main"; do
            if cosign verify-blob --bundle previous-vdr-monthly.bundle --certificate-identity "$identity" \
                 --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" previous-vdr-monthly.json 2>/dev/null; then ok=1; break; fi
          done
          [ "$ok" -eq 1 ] || { echo "::error::previous vdr-monthly.json does not verify; refusing to carry it forward"; exit 1; }
          prev=(--previous previous-vdr-monthly.json)
        else
          echo "No previous vdr-monthly.json published; the month starts with this build's runs."
        fi
        python3 ../scripts/build-vdr-monthly.py --vdr vdr-report.json --history vdr-history.json \
          --decisions ../data/decisions.json --activities ../data/vdr-activities.json \
          --non-machine vdr-non-machine-vv.json "${prev[@]}"
        cosign sign-blob --yes --new-bundle-format --bundle vdr-monthly.bundle vdr-monthly.json

    # The published VDR carries a SLSA/in-toto provenance attestation, and that
    # attestation binds to the artifact's sha256. Republishing vdr-report.json
    # without re-attesting it would leave the served
    # `vdr-report.json.intoto.jsonl` bound to bytes that are no longer there —
    # so scripts/verify-published.sh, and any third party following the README,
    # would get a verification FAILURE on the published evidence between
    # deploys. Publishing evidence that does not verify is the exact defect this
    # project exists to argue against, so the attestation is refreshed with the
    # report rather than left behind.
    #
    # The predicate takes its commit from the bound inventory's provenance, not
    # from this run's GITHUB_SHA, so it names the deployed commit and stays
    # consistent with everything else in the published set.
    - name: Attest VDR provenance (SLSA/in-toto)
      working-directory: infrastructure
      run: |
        set -euo pipefail
        python3 ../scripts/build-provenance.py \
          --ksi-signal ksi-signal.json --generator ../scripts/build-vdr-report.py \
          --output vdr-report.json.predicate.json
        cosign attest-blob --yes --new-bundle-format \
          --predicate vdr-report.json.predicate.json --type slsaprovenance1 \
          --bundle vdr-report.json.intoto.jsonl vdr-report.json
        # 1) signature + identity (trust), against THIS workflow's identity.
        cosign verify-blob-attestation --new-bundle-format \
          --bundle vdr-report.json.intoto.jsonl --type slsaprovenance1 \
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/evidence-nightly.yml@refs/heads/main" \
          --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
          vdr-report.json
        # 2) the dependency-free consumer checks the bindings (subject==artifact,
        #    inventory sha256, generator, commit) — fail closed.
        python3 ../scripts/verify-attestation.py \
          --bundle vdr-report.json.intoto.jsonl --artifact vdr-report.json \
          --ksi-signal ksi-signal.json

    # -------------------------------------------------------------------------
    # PUBLISH — one prefix (.well-known/vdr-*)
    # -------------------------------------------------------------------------
    # `s3api put-object` rather than `s3 cp`: a single unambiguous PutObject call
    # per object, so the role needs exactly s3:PutObject on
    # `.well-known/vdr-*` and nothing else. The bucket default-encrypts with
    # SSE-S3 (AES256), so no KMS grant is involved.
    # Publication redaction gate over exactly the files the next step uploads
    # (scripts/_redact.py): fails closed on any AWS account ID.
    # CDS-CSO-CBF: the complete human-readable view of each JSON republished
    # below, parsed back and required to reproduce it, so the views the deploy
    # published never drift from the JSON this run replaces.
    - name: Rebuild the human-readable views (format parity)
      working-directory: infrastructure
      run: >-
        python3 ../scripts/build-human-views.py
        vdr-report.json vdr-trend.json vdr-detail-report.json vdr-accepted-vulnerabilities.json vdr-history.json
        vdr-non-machine-vv.json vdr-monthly.json

    - name: Publication redaction gate (no AWS account ID)
      working-directory: infrastructure
      run: >-
        python3 ../scripts/check-published-redaction.py
        vdr-report.json vdr-report.md vdr-trend.json
        vdr-detail-report.json vdr-detail-report.md vdr-accepted-vulnerabilities.json
        vdr-accepted-vulnerabilities.md vdr-history.json vdr-non-machine-vv.json
        vdr-monthly.json vdr-monthly.md
        vdr-report.view.md vdr-trend.view.md vdr-detail-report.view.md
        vdr-accepted-vulnerabilities.view.md vdr-history.view.md
        vdr-non-machine-vv.view.md vdr-monthly.view.md

    - name: Publish VDR + trend to /.well-known/
      id: publish
      working-directory: infrastructure
      run: |
        set -euo pipefail
        put() {
          aws s3api put-object \
            --bucket "${SITE_BUCKET}" \
            --key ".well-known/$1" \
            --body "$1" \
            --content-type "$2" \
            --cache-control "public, max-age=300" \
            --query 'ETag' --output text > /dev/null
          echo "published .well-known/$1"
        }
        put vdr-report.json  "application/json"
        put vdr-report.bundle "application/json"
        put vdr-report.md    "text/markdown; charset=utf-8"
        put vdr-trend.json   "application/json"
        put vdr-trend.bundle "application/json"
        # CR26 vulnerability reports, rebuilt with the VDR report above.
        for a in vdr-detail-report vdr-accepted-vulnerabilities vdr-history; do
          put "$a.json"   "application/json"
          put "$a.bundle" "application/json"
        done
        put vdr-detail-report.md            "text/markdown; charset=utf-8"
        put vdr-accepted-vulnerabilities.md "text/markdown; charset=utf-8"
        # The complete human-readable views, rebuilt with the JSON above.
        for a in vdr-report vdr-trend vdr-detail-report vdr-accepted-vulnerabilities vdr-history vdr-non-machine-vv vdr-monthly; do
          put "$a.view.md" "text/markdown; charset=utf-8"
        done
        # Non-machine V&V status (VDR-TFR-NMV).
        put vdr-non-machine-vv.json   "application/json"
        put vdr-non-machine-vv.bundle "application/json"
        # Monthly activity report (VER-TFR-MHR).
        put vdr-monthly.json   "application/json"
        put vdr-monthly.bundle "application/json"
        put vdr-monthly.md     "text/markdown; charset=utf-8"
        # The refreshed provenance attestation. Its key matches the same
        # `.well-known/vdr-*` prefix, so it needs no extra IAM grant.
        put vdr-report.json.intoto.jsonl "application/json"

    # Scoped to exactly the paths this workflow wrote. The deploy path
    # invalidates `/*`; that is a whole-site operation and is not this
    # workflow's business.
    - name: Invalidate CloudFront cache (vdr paths only)
      # The distribution id reaches the shell through the environment rather
      # than being interpolated into the command line: an interpolated secret
      # is expanded into the script text before the runner ever executes it, so
      # it can surface in a trace or an error echo. Actions masks known secrets
      # in log output, but not putting it there is the stronger habit.
      env:
        DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      run: |
        set -euo pipefail
        aws cloudfront create-invalidation \
          --distribution-id "${DISTRIBUTION_ID}" \
          --paths "/.well-known/vdr-*" \
          --query 'Invalidation.Id' --output text
        echo "invalidation created for /.well-known/vdr-*"

    # -------------------------------------------------------------------------
    # THE CHECK THAT DID NOT EXIST
    # -------------------------------------------------------------------------
    # Everything above verifies the build. This verifies the CLAIM: fetch the
    # artifact over the public URL exactly as a third party would, assert the
    # served bytes are the bytes just built, and assert its emitted_at is inside
    # its governed window (infrastructure/schemas/freshness-config.json). Retries ride out CDN propagation.
    #
    # Deliberately not `aws cloudfront wait invalidation-completed`: polling the
    # public edge is a stronger check than asking the CDN's control plane
    # whether it thinks it is finished, and it keeps cloudfront:GetInvalidation
    # off the role.
    #
    # If this fails, the refresh did not achieve its purpose, the job fails, and
    # the alert job raises it with a human.
    - name: Assert published evidence is fresh at the edge
      working-directory: infrastructure
      run: |
        set -euo pipefail
        BUILT_SHA=$(sha256sum vdr-report.json | awk '{print $1}')
        python3 ../scripts/check-evidence-freshness.py \
          --url "${SITE_ORIGIN}/.well-known/vdr-report.json" \
          --expect-sha256 "${BUILT_SHA}" \
          --retries 12 --retry-delay 20

    # -------------------------------------------------------------------------
    # STATUS BEACON — written on every run, pass or fail
    # -------------------------------------------------------------------------
    # The evidence SLA watchdog (infrastructure/watchdog.tf) reads this hourly
    # from the bucket and pages the operator when the last run failed, or when
    # no run has reported in 26 hours (a disabled or stuck cron). It records
    # outcomes only: no finding ids, no scanner output. It is not evidence and
    # is neither signed nor attested; nothing but the watchdog consumes it.
    #
    # Written under .well-known/vdr-*, inside the scope this workflow's role
    # already has, so the beacon needs no new permission. If credentials were
    # never obtained there is nothing to write with, and the watchdog pages on
    # the beacon's age instead.
    - name: Write status beacon for the evidence watchdog
      if: ${{ always() && steps.awscreds.outcome == 'success' }}
      working-directory: infrastructure
      env:
        RUN_RESULT: ${{ job.status }}
        VULN_GATE: ${{ steps.vulngate.outcome }}
        RECONCILE: ${{ steps.reconcile.outcome }}
        PUBLISHED: ${{ steps.publish.outcome }}
      run: |
        set -euo pipefail
        # The gate-mode register version and every detect-and-recover event this
        # run recorded (REQ-GAT-1: a mode that does not block still publishes).
        python3 ../scripts/_gates.py status "${GATE_EVENTS_FILE}" > gate-status.json \
          || echo '{"gates": null, "gate_events": null}' > gate-status.json
        # What G7 found about each detection input, when the gate got that far.
        [ -s detection.json ] || echo 'null' > detection.json
        if [ -s conformance-results.json ]; then cp conformance-results.json conformance-status.json; else echo 'null' > conformance-status.json; fi
        jq -n \
          --slurpfile gs gate-status.json \
          --slurpfile det detection.json \
          --slurpfile prof conformance-status.json \
          --arg profsha "$(sha256sum conformance-results.json 2>/dev/null | cut -d' ' -f1)" \
          --arg result "${RUN_RESULT}" \
          --arg vuln_gate "${VULN_GATE:-not reached}" \
          --arg reconcile "${RECONCILE:-not reached}" \
          --arg published "${PUBLISHED:-not reached}" \
          --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg commit "${SIGNAL_COMMIT:-unknown}" \
          '{schema: "vdr-status/1", result: $result, finished_at: $finished_at,
            vuln_gate: $vuln_gate, reconcile: $reconcile, published: $published,
            inventory_commit: $commit, run_url: $run_url,
            gates: $gs[0].gates, gate_events: $gs[0].gate_events,
            detection: $det[0],
            profile: (if $prof[0] then {profile_version: $prof[0].profile_version, conformance_sha256: $profsha} else null end)}' > vdr-status.json
        # The beacon always publishes, so it is redacted rather than gated: a
        # failed AWS call's text can name the account (scripts/_redact.py).
        python3 ../scripts/_redact.py vdr-status.json
        cat vdr-status.json
        aws s3 cp vdr-status.json "s3://${SITE_BUCKET}/.well-known/vdr-status.json" \
          --content-type application/json --cache-control "no-cache"

  # ===========================================================================
  # JOB 3: ALERT — the job that has to work
  # ===========================================================================
  # The deploy workflow's `notify` job reported SUCCESS through twelve
  # consecutive nightly failures. Its condition to run was right; its only step
  # was gated on `github.event_name == 'push'`, so on a `schedule` event the step
  # was skipped, and a job whose only step is skipped concludes successfully.
  # Nothing was raised, nothing looked wrong, and the published evidence rotted.
  #
  # This job takes the opposite defaults:
  #   - no event gating whatsoever; a failed run alerts on every trigger
  #   - one issue, reopened and commented, instead of a new issue per failure
  #     (the deploy path has left 15+ identical open issues, which is the same
  #     as no alert at all)
  #   - assigned to the repository owner, so it reaches a person rather than a
  #     notifications tab
  #   - states the freshness deadline, so the message carries its own urgency
  #
  # RESIDUAL RISK, recorded rather than hidden: this alert rides on the same
  # scheduled workflow it is alerting about. If GitHub disables the cron — which
  # it does after 60 days with no repository activity — neither the refresh nor
  # this alert runs, and the silence looks identical to success. An alert that
  # cannot detect its own absence needs an out-of-band watchdog; that is a
  # follow-up, not something this workflow can solve from the inside.
  # ===========================================================================
  alert:
    name: Alert on stale evidence
    runs-on: ubuntu-latest
    needs: [sast, refresh]
    # The one exclusion: a skipped `sast` means the run was deliberately dropped
    # (a post-deploy trigger for a deploy that did not qualify), not that it failed.
    if: always() && needs.sast.result != 'skipped' && (needs.sast.result != 'success' || needs.refresh.result != 'success')
    permissions:
      contents: read
      issues: write
      # Read-only: find open Dependabot PRs for the packages the gate named.
      pull-requests: read

    steps:
    - name: Raise or update the stale-evidence issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      # Job results reach the script through the environment rather than by
      # `${{ }}` interpolation into the script body. These particular values are
      # a fixed vocabulary and could not carry an injection, but templating
      # workflow context straight into executable script is the habit that
      # causes those bugs, so the safe form is the one written down here.
      env:
        SAST_RESULT: ${{ needs.sast.result }}
        REFRESH_RESULT: ${{ needs.refresh.result }}
        VULN_GATE: ${{ needs.refresh.outputs.vuln_gate }}
        VULN_FINDINGS: ${{ needs.refresh.outputs.vuln_findings }}
        RECONCILE: ${{ needs.refresh.outputs.reconcile }}
        DETECTION: ${{ needs.refresh.outputs.detection }}
      with:
        script: |
          const TITLE = 'Evidence nightly failed — published compliance reporting is going stale';
          const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
          // Step outcomes: success | failure | cancelled | skipped, or empty when
          // the job never reached the step.
          const vulnGate = process.env.VULN_GATE || 'not reached';
          const reconcile = process.env.RECONCILE || 'not reached';
          const detection = process.env.DETECTION || 'not reached';
          const causes = [];
          if (detection === 'failure') {
            causes.push(`**Detection failed (G7).** A scanner or feed the VDR depends on was missing, malformed or stale, so nothing was built or published. The "Detection gate (G7)" step names each input and why; the status beacon's \`detection\` block records it.`);
          }
          if (reconcile === 'failure') {
            causes.push(`**The live reconciliation found drift.** The live site and its published documentation disagree. The "Reconciliation gate" step names the failing invariant.`);
          } else if (reconcile !== 'success') {
            causes.push(`**The live reconciliation did not run (\`${reconcile}\`).** Nothing compared the live site against its published documentation in this run. That is a separate problem from stale evidence: treat drift as unchecked until a run shows this gate passing.`);
          }
          if (vulnGate === 'failure') {
            const runbook = `${context.payload.repository.html_url}/blob/main/docs/runbooks/vuln-gate-failure.md`;
            let findings = [];
            try { findings = JSON.parse(process.env.VULN_FINDINGS || '[]'); } catch (e) { findings = []; }
            // Open Dependabot PRs, matched to each finding by package name.
            const openPRs = (await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            })).filter(p => p.head.ref.startsWith('dependabot/'));
            const lines = findings.map(id => {
              const ghsa = (id.match(/GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}/) || [])[0];
              const pkg = (id.match(/pkg:[^/]+\/(.+)@[^@]+$/) || [])[1];
              const pr = pkg && openPRs.find(p => p.title.includes(` ${pkg} `));
              const parts = [`- \`${id}\``];
              if (ghsa) parts.push(`[advisory](https://github.com/advisories/${ghsa})`);
              parts.push(pr ? `open Dependabot PR: #${pr.number}` : 'no open Dependabot PR');
              return parts.join(' — ');
            });
            causes.push([
              `**The vulnerability gate failed** on ${findings.length || 'one or more'} finding(s) with no fix and no disposition:`,
              ``,
              ...(lines.length ? lines : ['- (the run log\'s "Vulnerability gate" step names them)']),
              ``,
              `Fix each (a Dependabot PR plus a deploy clears it: the nightly scans the *published* commit), or record a decision for it in data/decisions.json. Remediation clocks run from first detection. Runbook: ${runbook}`,
            ].join('\n'));
          }
          if (causes.length === 0) {
            causes.push(`**Both gates passed or were not reached.** Check, in order: the freshness assertion at the end (published but not served), the setup steps before the gates, and the SAST job.`);
          }
          const body = [
            `The nightly VDR refresh did not complete, so \`/.well-known/vdr-report.json\` is not being updated.`,
            ``,
            `Published compliance reporting must be under 24 hours old. Every hour this stays broken is an hour the site is serving evidence that does not meet that policy.`,
            ``,
            `| | |`,
            `|---|---|`,
            `| Run | [${context.runId}](${runUrl}) |`,
            `| Trigger | \`${context.eventName}\` |`,
            `| Commit | ${context.sha} |`,
            `| SAST job | \`${process.env.SAST_RESULT}\` |`,
            `| Refresh job | \`${process.env.REFRESH_RESULT}\` |`,
            `| Detection gate (G7) | \`${detection}\` |`,
            `| Vulnerability gate | \`${vulnGate}\` |`,
            `| Reconciliation gate (live drift check) | \`${reconcile}\` |`,
            ``,
            ...causes.flatMap(c => [c, ``]),
            `This issue is reused rather than duplicated — each failure adds a comment. It will not close itself; close it once a run succeeds.`,
          ].join('\n');

          // One issue, not one per night. Search by exact title among open issues.
          const existing = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'all',
            per_page: 100,
            labels: 'evidence-freshness',
          });
          // Prefer an open issue, then the oldest. The lookup once created a
          // second issue while an identical open one existed (#330, #336) for a
          // reason the logs did not show, so record what it matched.
          const matches = existing
            .filter(i => i.title === TITLE && !i.pull_request)
            .sort((a, b) => (a.state === b.state ? a.number - b.number : a.state === 'open' ? -1 : 1));
          core.info(`Issue lookup: ${existing.length} labelled, ${matches.length} matching [${matches.map(i => `#${i.number}:${i.state}`).join(', ')}]`);
          const match = matches[0];

          if (match) {
            if (match.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, body,
            });
            core.notice(`Updated issue #${match.number}`);
          } else {
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              body,
              labels: ['compliance', 'evidence-freshness', 'urgent'],
              assignees: [context.repo.owner],
            });
            core.notice(`Created issue #${created.data.number}`);
          }

    # Independent of why the run failed, report how stale the published evidence
    # actually is right now. This is the number the policy is about, and it puts
    # a measured value in the run summary rather than leaving it to be inferred.
    - name: Report current published-evidence age
      if: always()
      run: |
        curl -sfL -o /tmp/served-vdr.json "${SITE_ORIGIN}/.well-known/vdr-report.json" || true
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json, datetime as dt, pathlib
        p = pathlib.Path('/tmp/served-vdr.json')
        if not p.exists() or not p.stat().st_size:
            print('## Published evidence\n\nCould not fetch the published VDR.')
        else:
            v = json.loads(p.read_text())
            raw = v.get('emitted_at', '')
            iso = raw[:-1] + '+00:00' if raw.endswith('Z') else raw
            age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(iso)).total_seconds() / 3600
            print(f'## Published evidence\n\n`emitted_at` **{raw}** — **{age:.1f}h** old (policy: under 24h).')
        PY
