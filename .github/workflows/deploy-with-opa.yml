# =============================================================================
# GitHub Actions Workflow: Deploy Website with OPA Compliance
# =============================================================================
# This workflow stops bad infrastructure from reaching production by checking
# security rules before deployment. If the infrastructure passes security
# checks, it gets deployed. If not, deployment is blocked.
#
# The process: Check security → Deploy if safe → Verify it worked
# =============================================================================

name: Deploy Website with OPA Compliance

# =============================================================================
# WHEN THIS RUNS
# =============================================================================
# Automatically when code changes, during code reviews, or manually
#
# NO `schedule:` TRIGGER — deliberately. This workflow's deploy job is bound to
# the `prod` GitHub Environment, which requires a human reviewer, so a scheduled
# run could never do the thing it was scheduled for: it stopped at the approval
# gate every night and nobody approved it. The daily continuous-vulnerability
# cadence (RA-5 / VDR-CSO-DET) now lives in `evidence-nightly.yml`, which
# re-runs the Syft + Grype scan against a freshly-pulled Grype database, puts it
# through the same vulnerability and reconciliation gates, and republishes only
# the VDR and its trend ledger — no `terraform apply` anywhere in it.
#
# The effect on this file is that every remaining path to a deploy is
# human-initiated (a merge to main, or an explicit dispatch) and every one of
# them still halts behind the `prod` reviewer.
# =============================================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
        - dev
        - staging
        - prod

# =============================================================================
# CONCURRENCY — serialize deploys so overlapping runs never race terraform apply
# =============================================================================
# This repo keeps NO remote Terraform state; each run rebuilds state by importing
# live resources before apply. Two deploys running at once therefore apply
# against the same AWS account from independent states and thrash ephemeral-state
# resources — most visibly the Cognito app client, whose server-generated id is
# baked into the SPA at build time: concurrent applies recreate the client, its
# id changes, and the deployed SPA is left pointing at a dead client_id (the
# Hosted-UI "an error was encountered with the requested page" failure).
# Serialize the deploy path to one run at a time, keyed by ref. Never cancel a
# run mid-apply — a partial terraform apply is worse than a queue — so the
# in-flight run finishes and the newest queued run goes next.
# =============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
# Tool versions and AWS region used everywhere
# =============================================================================
env:
  AWS_REGION: us-east-2
  # The per-deploy stack now persists state in S3 (Task 16), so resources no
  # longer need re-importing every run. The import steps are skipped by default
  # and kept only as a disaster-recovery path: set REBUILD_STATE=true to
  # re-adopt every live resource into a fresh/empty state.
  REBUILD_STATE: "false"
  TERRAFORM_VERSION: 1.5.0
  OPA_VERSION: 1.18.2
  REGAL_VERSION: 0.41.1
  # Published SHA-256 of opa_linux_amd64_static for OPA_VERSION above.
  # Refresh together with OPA_VERSION; source: https://openpolicyagent.org/downloads/v<version>/opa_linux_amd64_static.sha256
  OPA_SHA256: 9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8
  # Published SHA-256 of regal_Linux_x86_64 for REGAL_VERSION above. Refresh
  # together; source: the release's checksums.txt on github.com/open-policy-agent/regal
  REGAL_SHA256: 6769dcd8e88bc5ba5ff4fac500e4a99d55b3eec3d1d0842833d84f6820a2a80f
  NODE_VERSION: 22

# =============================================================================
# WHAT THIS WORKFLOW CAN DO
# =============================================================================
# Permissions needed to read code, create issues, and upload security results
# =============================================================================
permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: write
  id-token: write   # assume the plan (compliance-check) and deploy roles via GitHub OIDC

jobs:
  # ===========================================================================
  # JOB -1: QUEUE WATCHDOG
  # ===========================================================================
  # `timeout-minutes` bounds a job that is RUNNING. It does nothing for a job
  # that never gets a runner, and GitHub has no queue timeout of its own. On
  # 2026-08-06 the compliance job sat in `queued` for 48 minutes with zero steps
  # while its two siblings picked up runners and finished normally; the run hung
  # until GitHub garbage-collected it, and the merged research paper sat
  # undeployed the whole time.
  #
  # This waits for the three independent jobs to be picked up and cancels the
  # run if any of them is still queued after the grace period, turning an
  # open-ended hang into a fast, re-runnable failure.
  #
  # `deploy` and `notify` are deliberately not watched: they are queued waiting
  # on their dependencies, which is correct behaviour and not a stuck runner.
  #
  # Known limitation: this job needs a runner too, so it cannot help when
  # allocation fails completely. It covers the partial case actually observed,
  # where some jobs get runners and others do not.
  # ===========================================================================
  queue-watchdog:
    name: Queue watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write   # cancel this run; nothing else
    steps:
    - name: Cancel the run if a job never gets a runner
      env:
        GH_TOKEN: ${{ github.token }}
        GRACE_MINUTES: '12'
      run: |
        set -euo pipefail
        # Watch by exclusion, not by listing the jobs to watch. `deploy` and
        # `notify` are queued waiting on their dependencies, which is correct;
        # everything else queued has no runner. Excluding is the fail-safe
        # direction: renaming a watched job would silently drop it from an
        # inclusion list, whereas here it stays watched, and only a NEW dependent
        # job could cause a false cancel — which is loud and gets noticed.
        DEPENDENT='["Deploy Infrastructure","Notify on Failure","Queue watchdog"]'
        stuck=''
        for _ in $(seq 1 $(( GRACE_MINUTES * 2 ))); do
          stuck=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                    --jq "[.jobs[] | select(.status == \"queued\") | .name] - $DEPENDENT | join(\", \")")
          if [ -z "$stuck" ]; then
            echo "All independent jobs have runners."
            exit 0
          fi
          sleep 30
        done
        echo "::error::No runner after ${GRACE_MINUTES}m, still queued: ${stuck}"
        echo "Cancelling so this fails fast and can be re-run."
        gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
        exit 1

  # ===========================================================================
  # JOB 0: TEST GATE
  # ===========================================================================
  # Runs the Python unit suite and the OPA policy tests on every push and PR.
  # Needs no AWS credentials, so it gates pull requests cleanly and fast, and
  # the deploy job depends on it — a red test cannot ship. This is the safety
  # net that was written but never wired in.
  # ===========================================================================
  test:
    name: Unit tests (pytest + opa test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install test dependencies
      run: python3 -m pip install --user pytest jsonschema pyyaml cryptography 'ruff==0.15.20' 'mypy==2.1.0'

    - name: Setup OPA
      run: |
        curl -fL --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 120 \
          -o opa "https://openpolicyagent.org/downloads/v${{ env.OPA_VERSION }}/opa_linux_amd64_static"
        echo "${{ env.OPA_SHA256 }}  opa" | sha256sum -c -
        chmod 755 ./opa
        sudo mv opa /usr/local/bin

    - name: Python unit tests
      run: python3 -m pytest tests/ -q

    # REQ-GOV-2: run the method's conformance tests (data/method-profile.json
    # maps Appendix B T1-T74 to the tests that implement them) and record the
    # results. Runs here, in the job with no AWS credentials, rather than in
    # the deploy job: it executes the test suite and its unpinned test tools.
    # The deploy downloads, signs and publishes the results; every VDR-family
    # output names the profile version and their sha256. A failing mapped
    # test, or one that does not exist, fails this job, and the deploy needs it.
    - name: Run the conformance suite (REQ-GOV-2)
      run: python3 scripts/build-conformance.py --output conformance-results.json

    - name: Upload the conformance results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: conformance-results
        path: conformance-results.json
        if-no-files-found: error

    # The policy suite is an exhibit: format is enforced, strict compilation
    # with the input schema is enforced, coverage has a floor, and every eval
    # path uses --strict-builtin-errors so a broken builtin (the class of bug
    # that silently killed the old alt-text rule) fails loudly instead of
    # evaluating to undefined.
    - name: OPA policy checks (fmt, strict check, tests + coverage)
      run: |
        opa fmt --fail --list infrastructure/policy/
        opa check --strict --schema infrastructure/schemas/policy-input infrastructure/policy
        opa test --coverage --threshold 90 infrastructure/policy/ > /dev/null
        opa test infrastructure/policy/
        opa fmt --fail --list policies/
        opa check --strict policies/
        opa test --coverage --threshold 90 policies/ > /dev/null
        opa test policies/

    - name: Regal lint (Rego linter, pinned)
      run: |
        curl -L --fail --retry 3 -o regal \
          "https://github.com/open-policy-agent/regal/releases/download/v${REGAL_VERSION}/regal_Linux_x86_64"
        echo "${REGAL_SHA256}  regal" | sha256sum -c -
        chmod +x regal
        ./regal lint --format github infrastructure/policy

    # Control lineage has one source of truth: each rule's METADATA is diffed
    # against the KSI catalog, so a rule cannot claim a NIST control its
    # declared KSIs do not carry.
    - name: Policy annotation ↔ KSI catalog diff
      run: python3 scripts/check-policy-annotations.py

    # Exceptions-as-code hygiene: an expired exception no longer suppresses at
    # eval time AND fails the build here, so the register cannot rot.
    - name: Exception register expiry check
      run: python3 scripts/check-exceptions.py

    # Known Go-vs-Wasm builtin divergences (%q, %v-on-sets, host time) are
    # banned at lint time; the parity test catches what the corpus exercises,
    # this catches the rest before it exists. It also requires every sprintf
    # format to be a literal (or concat of literals) with no precision
    # specifier: the condition the closed sprintf-js finding rested on, kept
    # as a guard.
    - name: Wasm-safe builtin check
      run: python3 scripts/check-wasm-safe.py

    # Real-bug lint (pyflakes + bugbear, not cosmetic style) and lenient type
    # check. Config in pyproject.toml. Catches the class of latent bug the panel
    # review flagged (e.g. the unhashable-dict crash) before it reaches a deploy.
    - name: Ruff lint (scripts + tests)
      run: python3 -m ruff check scripts/ tests/

    - name: mypy type check (scripts)
      run: python3 -m mypy scripts/

  # ===========================================================================
  # JOB 1: SECURITY CHECK
  # ===========================================================================
  # Acts like a security guard - checks if infrastructure is safe before
  # allowing deployment. This is the main protection against bad deployments.
  # ===========================================================================
  compliance-check:
    name: OPA Compliance Check
    runs-on: ubuntu-latest
    # Cap the job so a stuck step (notably the intermittent OIDC/STS credential
    # hang) fails in minutes instead of GitHub's 6-hour default.
    timeout-minutes: 25
    outputs:
      compliant: ${{ steps.compliance.outputs.compliant }}
      silk_cognito_client_id: ${{ steps.appcfg.outputs.silk_cognito_client_id }}

    steps:
    # -------------------------------------------------------------------------
    # GET READY TO CHECK SECURITY
    # -------------------------------------------------------------------------
    # Download code and install the tools needed for security checking
    # -------------------------------------------------------------------------
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install infrastructure management tool
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false

    # Install security policy checking tool
    - name: Setup OPA
      run: |
        curl -fL --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 120 \
          -o opa "https://openpolicyagent.org/downloads/v${{ env.OPA_VERSION }}/opa_linux_amd64_static"
        echo "${{ env.OPA_SHA256 }}  opa" | sha256sum -c -
        chmod 755 ./opa
        sudo mv opa /usr/local/bin
        opa version

    # Install JavaScript runtime for Lambda functions
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: infrastructure/lambda/package-lock.json

    # Connect to AWS using stored credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      # The OIDC AssumeRoleWithWebIdentity call to regional STS intermittently
      # times out from GitHub runners. retry-max-attempts rides through a brief
      # blip; timeout-minutes caps a real outage at a quick, re-runnable failure
      # instead of hanging on GitHub's 6-hour default.
      timeout-minutes: 6
      with:
        # GitHub OIDC role assumption — no long-lived access key.
        # This job only plans, so it assumes the plan-only role
        # (infrastructure/bootstrap/plan-role.tf): read-only account access plus
        # the state lock. Deploy credentials exist only in the deploy job, behind
        # the prod environment approval. Role ARN is a repo variable so the
        # account ID stays out of the YAML.
        role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        retry-max-attempts: 5

    # The one live value the app build needs: the Silk Reeling SPA's Cognito app
    # client ID, read here with the read-only plan role so the build itself runs
    # with no credentials (app-build.yml). It is public: the SPA ships it to every
    # browser. A missing value is passed on empty, and the build fails on it.
    - name: Read the app build inputs
      id: appcfg
      run: |
        set -uo pipefail
        POOL=$(aws cognito-idp list-user-pools --max-results 60 --query "UserPools[?Name=='samaydlette-com-silk-reeling-users'].Id | [0]" --output text 2>/dev/null || true)
        ID=$(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL" --query "UserPoolClients[?ClientName=='samaydlette-com-silk-reeling-spa'].ClientId | [0]" --output text 2>/dev/null || true)
        if [[ "$ID" =~ ^[A-Za-z0-9_+]{1,128}$ ]] && [ "$ID" != None ]; then
          echo "silk_cognito_client_id=$ID" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::the Silk Reeling SPA client ID was not found; the app build will fail"
        fi

    # -------------------------------------------------------------------------
    # CREATE CONFIGURATION FILE
    # -------------------------------------------------------------------------
    # Build settings file from stored secrets and variables
    # -------------------------------------------------------------------------
    - name: Create terraform.tfvars
      working-directory: infrastructure
      run: |
        cat > terraform.tfvars << EOF
        domain_name     = "${{ vars.DOMAIN_NAME || 'samaydlette.com' }}"
        aws_region      = "${{ env.AWS_REGION }}"
        environment     = "${{ github.event.inputs.environment || 'prod' }}"
        cost_center     = "${{ vars.COST_CENTER || 'website-ops' }}"
        owner           = "${{ vars.OWNER || 'sam-aydlette' }}"
        existing_ssl_certificate_arn = "${{ secrets.SSL_CERTIFICATE_ARN }}"
        existing_cloudfront_distribution_id = "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
        existing_s3_bucket_name = "samaydlette.com"
        cloudfront_price_class = "${{ vars.CLOUDFRONT_PRICE_CLASS || 'PriceClass_100' }}"
        manage_dns = ${{ vars.MANAGE_DNS || 'true' }}
        compliance_check_schedule = "${{ vars.COMPLIANCE_SCHEDULE || 'rate(1 day)' }}"
        section_508_compliance_level = "${{ vars.SECTION_508_LEVEL || 'AA' }}"
        create_silk_reeling = true
        silk_reeling_package_path = "./silk-reeling.zip"
        EOF

    # -------------------------------------------------------------------------
    # PREPARE MONITORING FUNCTION
    # -------------------------------------------------------------------------
    # Package up the code that will monitor security after deployment
    # -------------------------------------------------------------------------
    - name: Install Lambda dependencies
      working-directory: infrastructure/lambda
      run: npm ci --omit=dev

    # Debug step to see what files exist (helpful for troubleshooting)
    - name: Debug Lambda directory
      working-directory: infrastructure
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== Infrastructure directory contents ==="
        ls -la
        echo "=== Lambda directory contents ==="
        ls -la lambda/ || echo "❌ Lambda dir missing"
        echo "=== Test zip creation ==="
        cd lambda && zip -r ../test-opa-compliance.zip . && cd ..
        ls -la test-opa-compliance.zip || echo "❌ Test zip failed"
        echo "=== File structure tree ==="
        find . -type f -name "*.js" -o -name "*.json" -o -name "*.rego" | head -10

    # Package monitoring function for deployment. The runtime Lambda evaluates
    # the same Rego policies the deploy gate uses, compiled to Wasm. Compiling
    # here so terraform's source_code_hash sees the same bytes the deploy job
    # will apply.
    - name: Create Lambda zip file
      working-directory: infrastructure
      run: |
        echo "Compiling the policy packages to Wasm for the runtime emitter..."
        opa build -t wasm -e terraform/compliance/compliance_report \
          -o /tmp/opa-bundle.tar.gz policy/
        tar -xzf /tmp/opa-bundle.tar.gz -C lambda /policy.wasm
        # Parameters-as-data: the bundle's data document (built from
        # infrastructure/policy/config/data.json) ships alongside the wasm;
        # the Lambda loads it via setData at cold start.
        tar -xzOf /tmp/opa-bundle.tar.gz /data.json > lambda/policy-data.json
        ls -la lambda/policy.wasm lambda/policy-data.json

        echo "Creating Lambda deployment package..."
        ../scripts/zip-deterministic.sh lambda opa-compliance.zip
        echo "Zip file created:"
        ls -la opa-compliance.zip

    # One artifact, two enforcement points: prove the CLI evaluation (deploy
    # gate) and the Wasm evaluation (the runtime Lambda's opa-wasm host)
    # agree on the full fixture corpus before this exact wasm ships. Wasm
    # builtins are partly implemented by the JS host, so agreement is a test
    # result, not a given (a %v-formatted set already diverged once).
    - name: Policy parity test (CLI vs Wasm)
      run: |
        NODE_PATH=infrastructure/lambda/node_modules node scripts/policy-parity-test.js \
          --wasm infrastructure/lambda/policy.wasm \
          --data infrastructure/lambda/policy-data.json

    # -------------------------------------------------------------------------
    # CHECK WHAT INFRASTRUCTURE WILL BE BUILT
    # -------------------------------------------------------------------------
    # Look at the infrastructure plan before building anything
    # -------------------------------------------------------------------------
    - name: Terraform Init
      working-directory: infrastructure
      run: terraform init -input=false

    - name: Terraform Validate
      working-directory: infrastructure
      run: terraform validate

    # Create a plan showing what will be built. The state lock is shared with
    # every other run's plan; the workflow-level concurrency group only
    # serializes runs on the SAME ref, so plans from different open PRs can
    # race for the lock. -lock-timeout makes a contending plan wait its turn
    # instead of failing the check.
    # The Silk Reeling resources are gated behind create_silk_reeling, and this
    # job now sets it true so the plan describes the same resource set the deploy
    # job applies. Without that the count collapsed to zero and EVERY pull
    # request planned to destroy 19 live resources — identically, whether the PR
    # touched infrastructure or bumped a GitHub Action. The gate passed anyway,
    # so it was evaluating a configuration that would tear down the app, and
    # returning the same answer regardless of its input.
    #
    # Turning the flag on needs a file to exist: the Lambda computes
    # source_code_hash = filebase64sha256(var.silk_reeling_package_path), which
    # terraform evaluates at PLAN time and errors on if the path is missing. This
    # job cannot build the real package — that needs the mirror repository, whose
    # token is not available here and is not in the Dependabot secret store at
    # all, so dependency PRs could never build it. A placeholder satisfies the
    # hash so the other resources plan against their real configuration.
    #
    # Consequence to expect, and to leave alone: the Lambda itself shows a diff
    # on filename/source_code_hash, because the placeholder is not the deployed
    # package. That is one known-noisy resource in exchange for the rest planning
    # honestly. This job never applies — the only terraform apply is in the
    # deploy job, which builds the real package first.
    - name: Stage a placeholder Silk Reeling package for planning
      working-directory: infrastructure
      run: |
        set -euo pipefail
        rm -rf _silk_stub silk-reeling.zip
        mkdir -p _silk_stub
        printf 'def handler(event, context):\n    raise RuntimeError("plan-only placeholder")\n' \
          > _silk_stub/lambda_handler.py
        ( cd _silk_stub && zip -qr ../silk-reeling.zip . )
        rm -rf _silk_stub
        test -s silk-reeling.zip && echo "placeholder staged for plan only (never applied)"

    - name: Terraform Plan
      working-directory: infrastructure
      run: terraform plan -lock-timeout=300s -out=tfplan

    # -------------------------------------------------------------------------
    # PLAN THE TRUST ROOT (read-only; reported, never applied)
    # -------------------------------------------------------------------------
    # infrastructure/bootstrap/ holds the IAM trust root: the OIDC provider, the
    # roles CI assumes, the state backend, CloudFront. CI must never apply it
    # (it would be rewriting its own permissions), so the operator applies it.
    # What CI can do is make it observable: plan it on every build with this
    # job's read-only credentials and publish the result, so a pending change
    # shows up in the trust center as a decision waiting on a person rather than
    # drifting unseen. -lock=false: a read-only plan never contends with an
    # operator apply. The summary carries resource addresses and actions only.
    # Never fails the job: reporting drift is the point, not blocking on it.
    # GitHub runs this script with `bash -e`, and plan -detailed-exitcode exits 2
    # when changes are pending, so every exit code is captured with `|| rc=$?`
    # rather than left to kill the step (tests/test_trust_root_plan_step.py).
    # The summary also records which bootstrap state version (serial + lineage,
    # metadata only; the state body is piped straight to jq, never written) the
    # plan read, so the deploy job can tell if the operator applied the trust
    # root while the run waited at the approval gate.
    - name: Plan the trust root (bootstrap stack)
      working-directory: infrastructure/bootstrap
      run: |
        set -uo pipefail
        rc=1; empty=""; stateargs=()
        if terraform init -input=false > trust-root-init.log 2>&1; then
          # An empty remote state means the one-time migration has not happened
          # yet; a plan would claim every resource needs creating. Say so instead.
          if [ -z "$(terraform state list 2>/dev/null | head -1)" ]; then
            empty="--state-empty"
          else
            rc=0
            terraform plan -input=false -lock=false -detailed-exitcode -out=trust-root.tfplan > trust-root-plan.log 2>&1 || rc=$?
            if [ "$rc" != 1 ]; then terraform show -json trust-root.tfplan > trust-root-plan-full.json || rc=1; fi
            ver=$(terraform state pull 2>/dev/null | jq -r '"\(.serial) \(.lineage)"' 2>/dev/null) || ver=""
            read -r serial lineage <<< "$ver" || true
            if [[ "${serial:-}" =~ ^[0-9]+$ && -n "${lineage:-}" ]]; then
              stateargs=(--state-serial "$serial" --state-lineage "$lineage")
            fi
          fi
        fi
        python3 ../../scripts/summarize-trust-root-plan.py --exit-code "$rc" $empty "${stateargs[@]}" \
          --plan-json trust-root-plan-full.json --commit "$GITHUB_SHA" > ../trust-root-plan.json
        rm -f trust-root-plan-full.json trust-root.tfplan
        echo "Trust root: $(python3 -c 'import json;print(json.load(open("../trust-root-plan.json"))["status"])')"

    # -------------------------------------------------------------------------
    # THE ACTUAL SECURITY CHECK
    # The accessibility scanner (pa11y) renders pages in the runner's system
    # Chrome; PUPPETEER_SKIP_DOWNLOAD avoids fetching a duplicate browser.
    # terraform-plan.sh fails closed if this install is missing.
    - name: Install accessibility scanner
      working-directory: tools/a11y
      env:
        PUPPETEER_SKIP_DOWNLOAD: "1"
      # --ignore-scripts: no dependency lifecycle script runs in this
      # credentialed job; puppeteer's browser download is skipped anyway
      # (the scan uses the runner's system Chrome).
      run: npm ci --no-audit --no-fund --ignore-scripts

    # -------------------------------------------------------------------------
    # This is where we check if the planned infrastructure is safe
    # If this fails, nothing gets deployed
    # -------------------------------------------------------------------------
    - name: Run OPA Compliance Check
      working-directory: infrastructure
      id: compliance
      run: |
        chmod +x ../scripts/terraform-plan.sh
        if ../scripts/terraform-plan.sh; then
          echo "compliant=true" >> $GITHUB_OUTPUT
          echo "✅ All compliance checks passed"
        else
          echo "compliant=false" >> $GITHUB_OUTPUT
          echo "❌ Compliance violations found"
          exit 1
        fi

    # -------------------------------------------------------------------------
    # SAVE WORK FOR NEXT STEP
    # -------------------------------------------------------------------------
    # Keep the validated plan and settings for the deployment job
    # -------------------------------------------------------------------------
    - name: Upload Terraform Plan Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: terraform-plan
        path: |
          infrastructure/tfplan
          infrastructure/tfplan.json
          infrastructure/validations.json
          infrastructure/trust-root-plan.json
        retention-days: 5

  # ===========================================================================
  # JOB 2: DEPLOY INFRASTRUCTURE
  # ===========================================================================
  # Only runs if security check passed. Builds the infrastructure,
  # uploads the website, and verifies everything works.
  # ===========================================================================
  # ===========================================================================
  # APPS: build and scan every app with no cloud credentials
  # ===========================================================================
  # npm install scripts and the scanners' installers are third-party code, so
  # they run in a job that holds no AWS credentials, no OIDC token and no
  # deployment environment (app-build.yml). The deploy job downloads the
  # packages it ships and the scans of exactly those trees.
  apps:
    name: Apps
    needs: [compliance-check]
    if: github.ref == 'refs/heads/main' && needs.compliance-check.outputs.compliant == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/app-build.yml
    with:
      mode: full
      silk-cognito-client-id: ${{ needs.compliance-check.outputs.silk_cognito_client_id }}
    secrets:
      app-repo-token: ${{ secrets.SILK_REELING_REPO_TOKEN }}

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    # Cap the job so a stuck step (notably the intermittent OIDC/STS credential
    # hang) fails in minutes instead of GitHub's 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # id-token: write is required for cosign keyless signing of the KSI
      # signal via the GitHub Actions OIDC provider. Without it, the Sigstore
      # signing step cannot obtain an OIDC token and `cosign sign-blob` fails.
      id-token: write
      # actions: read lets GITHUB_TOKEN download the weekly ZAP DAST artifact.
      # Dependabot alerts are read with the DEPENDABOT_ALERTS_TOKEN secret:
      # GITHUB_TOKEN cannot read them.
      actions: read
    # Detect-and-recover gate events (infrastructure/schemas/gate-modes.json) are
    # appended here by scripts/_gates.py and published with this run's evidence.
    env:
      GATE_EVENTS_FILE: /tmp/gate-events.jsonl
    needs: [test, compliance-check, security-scan, apps]
    # IMPORTANT: Only deploy if on main branch AND security check passed
    if: github.ref == 'refs/heads/main' && needs.compliance-check.outputs.compliant == 'true'
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
    # -------------------------------------------------------------------------
    # SET UP SAME ENVIRONMENT AS SECURITY CHECK
    # -------------------------------------------------------------------------
    # Full history: the policy index dates each policy by the last commit that
    # changed it, and a shallow clone makes every file look changed today.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false

    # OPA is required here so the deploy job can compile the policy packages to Wasm
    # for bundling into the Lambda zip. Same version + same SHA pin as the
    # compliance-check job, so the deploy-time gate and the runtime emitter
    # evaluate identical compiled bytes.
    - name: Setup OPA
      run: |
        curl -fL --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 120 \
          -o opa "https://openpolicyagent.org/downloads/v${{ env.OPA_VERSION }}/opa_linux_amd64_static"
        echo "${{ env.OPA_SHA256 }}  opa" | sha256sum -c -
        chmod 755 ./opa
        sudo mv opa /usr/local/bin
        opa version

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: infrastructure/lambda/package-lock.json

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      # See the compliance-check job: cap the intermittent OIDC/STS hang and
      # retry the assume-role call to ride through a brief blip.
      timeout-minutes: 6
      with:
        # GitHub OIDC role assumption — no long-lived access key.
        # Role ARN is a repo variable so the account ID stays out of the YAML.
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        retry-max-attempts: 5

    # -------------------------------------------------------------------------
    # RE-RENDER tfvars FROM SECRETS (not persisted as an artifact)
    # -------------------------------------------------------------------------
    - name: Create terraform.tfvars
      working-directory: infrastructure
      run: |
        cat > terraform.tfvars << EOF
        domain_name     = "${{ vars.DOMAIN_NAME || 'samaydlette.com' }}"
        aws_region      = "${{ env.AWS_REGION }}"
        environment     = "${{ github.event.inputs.environment || 'prod' }}"
        cost_center     = "${{ vars.COST_CENTER || 'website-ops' }}"
        owner           = "${{ vars.OWNER || 'sam-aydlette' }}"
        existing_ssl_certificate_arn = "${{ secrets.SSL_CERTIFICATE_ARN }}"
        existing_cloudfront_distribution_id = "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
        existing_s3_bucket_name = "samaydlette.com"
        cloudfront_price_class = "${{ vars.CLOUDFRONT_PRICE_CLASS || 'PriceClass_100' }}"
        manage_dns = ${{ vars.MANAGE_DNS || 'true' }}
        compliance_check_schedule = "${{ vars.COMPLIANCE_SCHEDULE || 'rate(1 day)' }}"
        section_508_compliance_level = "${{ vars.SECTION_508_LEVEL || 'AA' }}"
        create_silk_reeling = true
        silk_reeling_package_path = "./silk-reeling.zip"
        EOF

    - name: Download Terraform Plan Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: terraform-plan
        path: infrastructure/

    # SAST results from the security-scan job (Checkov SARIF + tfsec JSON).
    # Consumed by the VDR aggregator step further down.
    - name: Download SAST Results Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: sast-results
        path: infrastructure/

    # Conformance results from the test job (REQ-GOV-2): signed and published
    # below, and named by the VDR.
    - name: Download the conformance results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: conformance-results
        path: infrastructure/

    # -------------------------------------------------------------------------
    # REBUILD MONITORING FUNCTION
    # -------------------------------------------------------------------------
    - name: Install Lambda dependencies
      working-directory: infrastructure/lambda
      run: npm ci --omit=dev

    - name: Create Lambda deployment package
      working-directory: infrastructure
      run: |
        # The runtime Lambda evaluates the same Rego policies the deploy gate
        # uses, compiled to Wasm. One source of truth, one trust chain, no
        # hand-port drift. The Wasm build is byte-stable for a fixed OPA
        # version + policy sources, so terraform's source_code_hash from the
        # compliance-check job matches the bytes deployed here.
        echo "Compiling the policy packages to Wasm for the runtime emitter..."
        opa build -t wasm -e terraform/compliance/compliance_report \
          -o /tmp/opa-bundle.tar.gz policy/
        tar -xzf /tmp/opa-bundle.tar.gz -C lambda /policy.wasm
        # Parameters-as-data: the bundle's data document (built from
        # infrastructure/policy/config/data.json) ships alongside the wasm;
        # the Lambda loads it via setData at cold start.
        tar -xzOf /tmp/opa-bundle.tar.gz /data.json > lambda/policy-data.json
        ls -la lambda/policy.wasm lambda/policy-data.json

        echo "Creating Lambda deployment package..."
        ../scripts/zip-deterministic.sh lambda opa-compliance.zip
        echo "Lambda package created:"
        ls -la opa-compliance.zip

    - name: Terraform Init
      working-directory: infrastructure
      run: terraform init -input=false
    
    # -------------------------------------------------------------------------
    # BUILD THE INFRASTRUCTURE  
    # -------------------------------------------------------------------------
    - name: Import Existing Resources (if needed)
      if: ${{ env.REBUILD_STATE == 'true' }}
      working-directory: infrastructure
      run: |
        echo "Checking for existing AWS resources to import..."
        
        # Import IAM role if it exists
        if aws iam get-role --role-name "samaydlette-com-lambda-opa-role" >/dev/null 2>&1; then
          echo "IAM role exists in AWS"
          if ! terraform state show aws_iam_role.lambda_opa >/dev/null 2>&1; then
            echo "Importing IAM role..."
            terraform import aws_iam_role.lambda_opa "samaydlette-com-lambda-opa-role"
            echo "✅ IAM role imported"
          else
            echo "IAM role already in Terraform state"
          fi
        else
          echo "No existing IAM role found - will be created"
        fi
        
        # Import IAM role policy if it exists
        if aws iam get-role-policy --role-name "samaydlette-com-lambda-opa-role" --policy-name "samaydlette-com-lambda-opa-policy" >/dev/null 2>&1; then
          echo "IAM role policy exists in AWS"
          if ! terraform state show aws_iam_role_policy.lambda_opa >/dev/null 2>&1; then
            echo "Importing IAM role policy..."
            terraform import aws_iam_role_policy.lambda_opa "samaydlette-com-lambda-opa-role:samaydlette-com-lambda-opa-policy"
            echo "✅ IAM role policy imported"
          else
            echo "IAM role policy already in Terraform state"
          fi
        else
          echo "No existing IAM role policy found - will be created"
        fi
        
        # Import the at-rest CMK + its alias if they exist.
        # State is ephemeral per run, so the unconditional aws_kms_key.at_rest would
        # otherwise be created fresh every run — orphaning keys and colliding on the
        # alias. Resolve the key by its stable alias and adopt both into state.
        if aws kms describe-key --key-id alias/samaydlette-com-at-rest >/dev/null 2>&1; then
          AT_REST_KEY_ID=$(aws kms describe-key --key-id alias/samaydlette-com-at-rest --query 'KeyMetadata.KeyId' --output text)
          echo "At-rest CMK exists in AWS ($AT_REST_KEY_ID)"
          if ! terraform state show aws_kms_key.at_rest >/dev/null 2>&1; then
            echo "Importing at-rest CMK..."
            terraform import aws_kms_key.at_rest "$AT_REST_KEY_ID"
            echo "✅ At-rest CMK imported"
          else
            echo "At-rest CMK already in Terraform state"
          fi
          if ! terraform state show aws_kms_alias.at_rest >/dev/null 2>&1; then
            echo "Importing at-rest CMK alias..."
            terraform import aws_kms_alias.at_rest "alias/samaydlette-com-at-rest"
            echo "✅ At-rest CMK alias imported"
          else
            echo "At-rest CMK alias already in Terraform state"
          fi
        else
          echo "No existing at-rest CMK found - will be created"
        fi

        # Import the compliance Lambda's dead-letter queue if it exists.
        # Ephemeral state: adopt it so it isn't recreated each run.
        DLQ_URL=$(aws sqs get-queue-url --queue-name samaydlette-com-opa-compliance-dlq --query 'QueueUrl' --output text 2>/dev/null || true)
        if [ -n "$DLQ_URL" ] && [ "$DLQ_URL" != "None" ]; then
          if ! terraform state show 'aws_sqs_queue.compliance_dlq[0]' >/dev/null 2>&1; then
            echo "Importing compliance DLQ..."
            terraform import 'aws_sqs_queue.compliance_dlq[0]' "$DLQ_URL"
            echo "✅ compliance DLQ imported"
          else
            echo "Compliance DLQ already in Terraform state"
          fi
        else
          echo "No existing compliance DLQ found - will be created"
        fi

        # Import the runtime-signal signing CMK + alias if they exist.
        # Ephemeral state: resolve the key by its stable alias and
        # adopt both so the asymmetric signing key is not recreated each run.
        if aws kms describe-key --key-id alias/samaydlette-com-runtime-signing >/dev/null 2>&1; then
          SIGNING_KEY_ID=$(aws kms describe-key --key-id alias/samaydlette-com-runtime-signing --query 'KeyMetadata.KeyId' --output text)
          echo "Runtime-signing CMK exists in AWS ($SIGNING_KEY_ID)"
          if ! terraform state show aws_kms_key.runtime_signing >/dev/null 2>&1; then
            echo "Importing runtime-signing CMK..."
            terraform import aws_kms_key.runtime_signing "$SIGNING_KEY_ID"
            echo "✅ Runtime-signing CMK imported"
          else
            echo "Runtime-signing CMK already in Terraform state"
          fi
          if ! terraform state show aws_kms_alias.runtime_signing >/dev/null 2>&1; then
            echo "Importing runtime-signing CMK alias..."
            terraform import aws_kms_alias.runtime_signing "alias/samaydlette-com-runtime-signing"
            echo "✅ Runtime-signing CMK alias imported"
          else
            echo "Runtime-signing CMK alias already in Terraform state"
          fi
        else
          echo "No existing runtime-signing CMK found - will be created"
        fi

        # Import DNSSEC resources if they exist (Task 5 PR B, D-3). Ephemeral
        # state: the KSK (us-east-1 KMS key), its alias, the Route 53 key-signing
        # key, and the hosted-zone-dnssec association are adopted so they are not
        # recreated each run. All are no-ops on the first deploy (created then).
        if aws kms describe-key --region us-east-1 --key-id alias/samaydlette-com-dnssec-ksk >/dev/null 2>&1; then
          DNSSEC_KEY_ID=$(aws kms describe-key --region us-east-1 --key-id alias/samaydlette-com-dnssec-ksk --query 'KeyMetadata.KeyId' --output text)
          # Resolve the zone via list-hosted-zones (the deploy role has this; it
          # does not have ListHostedZonesByName).
          ZONE_ID=$(aws route53 list-hosted-zones --query "HostedZones[?Name=='samaydlette.com.'].Id | [0]" --output text | sed 's#/hostedzone/##')
          echo "DNSSEC KSK exists ($DNSSEC_KEY_ID), zone $ZONE_ID"
          terraform state show 'aws_kms_key.dnssec_ksk[0]' >/dev/null 2>&1 || terraform import 'aws_kms_key.dnssec_ksk[0]' "$DNSSEC_KEY_ID"
          terraform state show 'aws_kms_alias.dnssec_ksk[0]' >/dev/null 2>&1 || terraform import 'aws_kms_alias.dnssec_ksk[0]' "alias/samaydlette-com-dnssec-ksk"
          # The KSK and zone-signing association may not exist yet (created on the
          # run that first enables signing), so tolerate a failed import.
          if [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != "None" ]; then
            terraform state show 'aws_route53_key_signing_key.this[0]' >/dev/null 2>&1 || terraform import 'aws_route53_key_signing_key.this[0]' "${ZONE_ID},samaydlette_com_ksk" || echo "KSK not created yet - will be created"
            terraform state show 'aws_route53_hosted_zone_dnssec.this[0]' >/dev/null 2>&1 || terraform import 'aws_route53_hosted_zone_dnssec.this[0]' "$ZONE_ID" || echo "zone signing not enabled yet - will be enabled"
          fi
          echo "✅ DNSSEC resources imported (where present)"
        else
          echo "No existing DNSSEC KSK found - will be created"
        fi

        # Import the access-log bucket if it exists. Ephemeral
        # state: the bucket would otherwise be recreated each run (and fail as a
        # name collision), so adopt it when present.
        if aws s3api head-bucket --bucket samaydlette-com-logs >/dev/null 2>&1; then
          if ! terraform state show aws_s3_bucket.logs >/dev/null 2>&1; then
            echo "Importing access-log bucket..."
            terraform import aws_s3_bucket.logs samaydlette-com-logs
            echo "✅ access-log bucket imported"
          else
            echo "Access-log bucket already in Terraform state"
          fi
        else
          echo "No existing access-log bucket found - will be created"
        fi

        # Import the compliance Lambda's log group if it exists (auto-created by
        # Lambda; now managed for customer-CMK encryption + retention).
        # Must precede the Lambda import since the function depends_on it.
        if aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/samaydlette-com-opa-compliance" --query 'logGroups[?logGroupName==`/aws/lambda/samaydlette-com-opa-compliance`]' --output text | grep -q .; then
          echo "Compliance Lambda log group exists in AWS"
          if ! terraform state show 'aws_cloudwatch_log_group.opa_compliance[0]' >/dev/null 2>&1; then
            echo "Importing compliance Lambda log group..."
            terraform import 'aws_cloudwatch_log_group.opa_compliance[0]' "/aws/lambda/samaydlette-com-opa-compliance"
            echo "✅ Compliance Lambda log group imported"
          else
            echo "Compliance Lambda log group already in Terraform state"
          fi
        else
          echo "No existing compliance Lambda log group found - will be created"
        fi

        # Import Lambda function if it exists
        if aws lambda get-function --function-name "samaydlette-com-opa-compliance" >/dev/null 2>&1; then
          echo "Lambda function exists in AWS"
          if ! terraform state show 'aws_lambda_function.opa_compliance[0]' >/dev/null 2>&1; then
            echo "Importing Lambda function..."
            terraform import 'aws_lambda_function.opa_compliance[0]' "samaydlette-com-opa-compliance"
            echo "✅ Lambda function imported"
          else
            echo "Lambda function already in Terraform state"
          fi
        else
          echo "No existing Lambda function found - will be created"
        fi
        
        # Import EventBridge rule if it exists
        if aws events describe-rule --name "samaydlette-com-opa-compliance" >/dev/null 2>&1; then
          echo "EventBridge rule exists in AWS"
          if ! terraform state show 'aws_cloudwatch_event_rule.opa_compliance[0]' >/dev/null 2>&1; then
            echo "Importing EventBridge rule..."
            terraform import 'aws_cloudwatch_event_rule.opa_compliance[0]' "samaydlette-com-opa-compliance"
            echo "✅ EventBridge rule imported"
          else
            echo "EventBridge rule already in Terraform state"
          fi
        else
          echo "No existing EventBridge rule found - will be created"
        fi
        
        # Import EventBridge target if it exists (targets are part of the rule, check if targets exist)
        if aws events list-targets-by-rule --rule "samaydlette-com-opa-compliance" --query 'Targets[?Id==`TriggerLambdaTarget`]' --output text >/dev/null 2>&1; then
          echo "EventBridge target exists in AWS"
          if ! terraform state show 'aws_cloudwatch_event_target.lambda[0]' >/dev/null 2>&1; then
            echo "Importing EventBridge target..."
            terraform import 'aws_cloudwatch_event_target.lambda[0]' "samaydlette-com-opa-compliance/TriggerLambdaTarget"
            echo "✅ EventBridge target imported"
          else
            echo "EventBridge target already in Terraform state"
          fi
        else
          echo "No existing EventBridge target found - will be created"
        fi
        
        # Import Lambda permission if it exists
        if aws lambda get-policy --function-name "samaydlette-com-opa-compliance" >/dev/null 2>&1; then
          echo "Lambda function has permissions configured"
          if ! terraform state show 'aws_lambda_permission.allow_eventbridge[0]' >/dev/null 2>&1; then
            echo "Importing Lambda permission..."
            terraform import 'aws_lambda_permission.allow_eventbridge[0]' "samaydlette-com-opa-compliance/AllowExecutionFromEventBridge"
            echo "✅ Lambda permission imported"
          else
            echo "Lambda permission already in Terraform state"
          fi
        else
          echo "No existing Lambda permissions found - will be created"
        fi
    
    # -------------------------------------------------------------------------
    # THE APP PACKAGES AND THEIR DEPENDENCY SCANS, from the apps job
    # -------------------------------------------------------------------------
    # Built and scanned without credentials (app-build.yml): each app's package
    # (silk-reeling.zip, which Terraform picks up via silk_reeling_package_path)
    # and, for every tree in data/apps.json, its SBOM and Grype result. The
    # Grype results feed the detection gate (G7) and the VDR, the app SBOMs the
    # inventory. A missing scan stays missing, and the detection gate fails on it.
    #
    # The artifact comes from a job that ran third-party code, so it lands in its
    # own directory and only the file names this repository expects are taken:
    # the package Terraform deploys and each manifest tree's SBOM and Grype result.
    # Nothing else in it can replace a file this job built or reads.
    - name: Download the app packages and scans
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: app-build
        path: infrastructure/_app-build

    - name: Take the expected app files
      working-directory: infrastructure
      run: bash ../scripts/take-app-build.sh full _app-build

    # -------------------------------------------------------------------------
    # IMPORT APP RESOURCES (disaster recovery) — each app's import hook adopts
    # its live resources into an empty state (mirrors "Import Existing
    # Resources" above). The hooks are named in data/apps.json.
    # -------------------------------------------------------------------------
    - name: Import app resources (if needed)
      if: ${{ env.REBUILD_STATE == 'true' }}
      working-directory: infrastructure
      run: bash ../scripts/app-hooks.sh import

    # -------------------------------------------------------------------------
    # STOP THE LINE — refuse to deploy over a system already in drift.
    #
    # The runtime Lambda compares its daily live evaluation against the published
    # deploy-time verdict and records the result in the signed runtime signal.
    # This reads that verdict and blocks BEFORE anything is mutated: after
    # `terraform apply` it would be too late to stop, and the reconciliation gate
    # (which runs post-apply, pre-publish) answers a different question.
    #
    # It blocks on status=diverged with a fresh signal. An unreadable, missing,
    # stale, or degraded signal is an observer fault, recorded in
    # infrastructure/schemas/gate-modes.json as detect-and-recover: a gate that
    # can only be cleared by deploying must not be wedgeable by the absence of
    # its own input. See the script header for the full rationale.
    #
    # Break glass when the deploy IS the fix:
    #   --allow-divergence "reason"
    # -------------------------------------------------------------------------
    - name: Runtime divergence pre-flight (stop the line)
      run: python3 scripts/check-runtime-divergence.py

    # -------------------------------------------------------------------------
    # DETECTION INPUTS AND G7 — before anything is applied
    # -------------------------------------------------------------------------
    # The previous VDR, Dependabot alerts, the CISA KEV catalog, FIRST EPSS and
    # the latest weekly DAST report, fetched here (not after apply) so that a
    # detection failure stops the deploy before it mutates anything (T52: G7
    # blocks every team). A failed fetch leaves <file>.error, never an empty
    # stand-in. The SAST files come from the security-scan job, Grype from above.
    - name: Fetch detection feeds
      working-directory: infrastructure
      env:
        SITE_ORIGIN: https://samaydlette.com
        DEPENDABOT_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash ../scripts/fetch-detection-feeds.sh

    - name: Detection gate (G7)
      working-directory: infrastructure
      run: bash ../scripts/run-gates.sh detection

    - name: Generate fresh Terraform plan
      working-directory: infrastructure
      run: terraform plan -lock-timeout=300s -out=tfplan

    - name: Terraform Apply
      working-directory: infrastructure
      run: terraform apply -lock-timeout=300s -auto-approve tfplan

    # Each app's runtime check asks the running app what it actually sees and
    # stops before publishing if that differs from Terraform. (Silk Reeling's
    # Lambda once ran a stale environment for four months while every apply
    # reported it updated.) The checks are named in data/apps.json.
    - name: App runtime checks
      working-directory: infrastructure
      run: bash ../scripts/app-hooks.sh runtime-check

    # -------------------------------------------------------------------------
    # CACHE-BUST WEBSITE ASSETS
    # -------------------------------------------------------------------------
    # Bumps the ?v=<timestamp> query string on every CSS/JS reference in
    # website/**.html so browsers refetch assets rather than serving stale
    # cached copies. Runs in-place; the next step uploads the rewritten files.
    # -------------------------------------------------------------------------
    - name: Cache-bust website assets
      run: node update-cache-version.js

    # The app's public auth config has to match the settings Terraform just
    # applied, so it publishes here even if a later gate fails. The website sync
    # skips .well-known/, so it never removes this file.
    - name: Publish Silk Reeling auth config
      working-directory: infrastructure
      run: |
        BUCKET_NAME=$(terraform output -raw s3_bucket_name)
        AUTH_CFG=$(terraform output -raw silk_reeling_auth_config_json 2>/dev/null || echo "")
        # The SPA fetches /.well-known/silk-reeling-auth.json
        # to resolve the live client_id at runtime. Written via cp (the deploy role
        # has PutObject; an aws_s3_object resource fails on GetObjectTagging).
        if [ -n "$AUTH_CFG" ]; then
          printf '%s' "$AUTH_CFG" > /tmp/silk-reeling-auth.json
          aws s3 cp /tmp/silk-reeling-auth.json "s3://$BUCKET_NAME/.well-known/silk-reeling-auth.json" \
            --content-type application/json --cache-control no-cache
          echo "✅ Published /.well-known/silk-reeling-auth.json"
        fi

    # -------------------------------------------------------------------------
    # BUILD AND PUBLISH THE DEPLOY-TIME KSI SIGNAL
    # -------------------------------------------------------------------------
    # The signal joins terraform state, the Lambda's package-lock, the website
    # HTML hashes, the CI provenance from GITHUB_* env vars, and the OPA
    # validations from the compliance-check job into a single signed JSON
    # document at /.well-known/ksi-signal.json.
    # -------------------------------------------------------------------------
    # The canonical inventory includes the CI/CD trust root (the bootstrap
    # stack's OIDC provider, CI roles and state backend) by reading that stack's
    # state. It is operator-applied and its state is remote and read-only to this
    # role, so initialize it here. Best-effort, as build_bootstrap_components()
    # always has been: when the state is not readable the builder omits those
    # components and says so, rather than failing the deploy.
    #
    # The state is read ONCE, here, into tfstate-bootstrap.json, and both the
    # inventory (BOOTSTRAP_STATE_JSON) and the boundary map read that file, so
    # the two cannot describe different moments. The same moment's state
    # version is checked against the one the trust-root plan read back in
    # compliance-check: if the operator applied the trust root while this run
    # waited at the approval gate, the plan is marked superseded rather than
    # published as pending changes that have already been applied. The file can
    # hold secret values: owner-only, never uploaded, deleted by the last step.
    - name: Read the trust-root state (bootstrap stack, read-only)
      working-directory: infrastructure/bootstrap
      continue-on-error: true
      run: |
        umask 077
        if terraform init -input=false > /dev/null 2>&1 && terraform show -json > ../tfstate-bootstrap.json 2>/dev/null \
            && [ -s ../tfstate-bootstrap.json ]; then
          echo "Trust-root state readable: the inventory will include the bootstrap identities."
          ver=$(terraform state pull 2>/dev/null | jq -r '"\(.serial) \(.lineage)"' 2>/dev/null) || ver=""
          read -r serial lineage <<< "$ver" || true
          if [[ "${serial:-}" =~ ^[0-9]+$ && -n "${lineage:-}" && -s ../trust-root-plan.json ]]; then
            python3 ../../scripts/summarize-trust-root-plan.py --reconcile-state "$serial" "$lineage" --in ../trust-root-plan.json
          fi
        else
          rm -f ../tfstate-bootstrap.json
          echo "::warning::Trust-root state not readable; the bootstrap identities are omitted from this inventory."
        fi

    - name: Build deploy-time KSI signal
      working-directory: infrastructure
      env:
        # Tells the emitter to pre-populate provenance.attestation with the
        # sidecar bundle URL before signing. The URL is well-known.
        KSI_SIGN: "1"
        # The bootstrap state snapshot taken by the step above (absent when it
        # was unreadable, in which case the builder omits those components).
        BOOTSTRAP_STATE_JSON: tfstate-bootstrap.json
      run: |
        echo "Building deploy-time KSI signal..."
        python3 ../scripts/build-ksi-signal.py
        echo "Signal contents (truncated):"
        jq '{signal_id, emitted_at, csp, system_id,
             component_count: (.components | length),
             validation_count: (.validations | length),
             attestation: .provenance.attestation,
             validation_results: [.validations[].result] | group_by(.) | map({(.[0]): length}) | add}' \
          ksi-signal.json

    # Inventory gate: block the deploy if the emitted canonical inventory is
    # malformed (invalid/duplicate identifiers). The inventory is the join layer
    # the whole architecture rests on, so this runs BEFORE signing/publishing.
    - name: Gate KSI signal (PURL validity, native_id uniqueness, typing)
      working-directory: infrastructure
      run: python3 ../scripts/validate-ksi-signal.py ksi-signal.json

    # -------------------------------------------------------------------------
    # SIGN THE KSI SIGNAL (Sigstore keyless via GitHub OIDC)
    # -------------------------------------------------------------------------
    # Produces a Sigstore bundle (cert + signature + Rekor inclusion proof) as
    # ksi-signal.bundle. Verifiers fetch both files and run:
    #   cosign verify-blob --bundle ksi-signal.bundle \
    #     --certificate-identity 'https://github.com/sam-aydlette/samaydlette.com/.github/workflows/deploy-with-opa.yml@refs/heads/main' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
    #     ksi-signal.json
    # -------------------------------------------------------------------------
    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    - name: Sign KSI signal
      working-directory: infrastructure
      run: |
        echo "Signing ksi-signal.json with cosign keyless..."
        cosign sign-blob --yes --new-bundle-format --bundle ksi-signal.bundle ksi-signal.json
        echo "Bundle written:"
        ls -la ksi-signal.bundle

    # -------------------------------------------------------------------------
    # SIGN + VERIFY THE OPA POLICY BUNDLE (supply-chain hardening — Task 13 / S1)
    # -------------------------------------------------------------------------
    # The deploy gate evaluates the policy packages and the runtime emitter re-validates
    # with the Wasm compiled from the same source (/tmp/opa-bundle.tar.gz, built in
    # the "Create Lambda zip file" step and shipped in the Lambda package). Sign
    # that compiled bundle keyless and verify the signature here against the pinned
    # workflow identity, so the policy that gates the deploy and re-runs at runtime
    # is tamper-evident and independently verifiable rather than trusted implicitly.
    # Fails closed if the signature or identity does not check. Additive only — no
    # change to any existing artifact or its signature.
    - name: Sign and verify the OPA policy bundle
      working-directory: infrastructure
      run: |
        cp /tmp/opa-bundle.tar.gz opa-policy-bundle.tar.gz
        echo "Signing the compiled OPA policy bundle with cosign keyless..."
        cosign sign-blob --yes --new-bundle-format --bundle opa-policy-bundle.tar.gz.bundle opa-policy-bundle.tar.gz
        echo "Verifying the signature against the pinned workflow identity (fail closed)..."
        cosign verify-blob \
          --bundle opa-policy-bundle.tar.gz.bundle \
          --certificate-identity 'https://github.com/sam-aydlette/samaydlette.com/.github/workflows/deploy-with-opa.yml@refs/heads/main' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          opa-policy-bundle.tar.gz
        echo "✅ OPA policy bundle signed and verified against the pinned identity"

    # The Rev5 Moderate figures are not stamped into committed HTML: the trust
    # center renders them from trust-center.json, which build-trust-center.py
    # computes on every deploy from the control projection (scripts/_controls.py),
    # so there is nothing committed to drift.
    # The OSCAL SSP that used to be built here is retired (CR26): the SDR carries
    # the per-control record (rev5_controls) and the CPO the package overview.

    # -------------------------------------------------------------------------
    # BUILD THE VDR REPORT  (published after the reconciliation gate) (FedRAMP 20x VDR-RPT-PER, VDR-TFR-MHR)
    # -------------------------------------------------------------------------
    # Aggregates SAST/SCA findings (currently OPA gate; Checkov, tfsec, and
    # Dependabot are wired in via optional --flags as those tools are added
    # to the workflow), classifies each per VDR-EVA-* (PAIN N1-N5, IRV, LEV),
    # and emits a Class C-tiered report. The build is the report. If any
    # finding exceeds the Class C tolerance per VDR-TFR-PVR, this step exits
    # non-zero and the build fails — the report becomes the block.
    # -------------------------------------------------------------------------
    # The detection inputs (previous VDR, Dependabot, KEV, EPSS, DAST) were
    # fetched and checked by the detection gate (G7) before apply.
    # The signed runtime signal is the only live read a mitigation can cite
    # (rule 1: a mitigation verified by a live read makes a finding fully
    # mitigated). The builder verifies its signature against
    # infrastructure/keys/runtime-signing-key.json and its age; anything short
    # of verified and fresh voids every mitigation that needs a live read, so a
    # failed fetch can only keep findings open, never close them.
    - name: Fetch the signed runtime signal (live read for mitigations)
      working-directory: infrastructure
      run: |
        if curl -sfL --retry 3 --retry-delay 2 -o ksi-signal-runtime.json \
            "https://samaydlette.com/.well-known/ksi-signal-runtime.json"; then
          echo "Runtime signal fetched: emitted $(jq -r '.emitted_at' ksi-signal-runtime.json 2>/dev/null || echo 'unreadable; the builder will reject it')"
        else
          echo "::warning::Could not fetch the runtime signal; mitigations that need a live read are void this run."
          rm -f ksi-signal-runtime.json
        fi

    - name: Build VDR Report (FedRAMP 20x Class C)
      working-directory: infrastructure
      run: |
        set -euo pipefail
        # The inputs both workflows share are in run-gates.sh; the deploy adds its OPA results.
        bash ../scripts/run-gates.sh vdr --opa validations.json
        echo "VDR summary:"
        jq '{summary, rules_reference, risk_accepted_count: (.risk_accepted | length)}' vdr-report.json

    # Vulnerability gate (Task T): fail the build on any scanner-reported
    # vulnerability (Grype SCA, ZAP DAST, Dependabot) that is not remediated or
    # dispositioned false-positive / operational-requirement in
    # data/decisions.json. Risk-adjustment does not pass.
    - name: Vulnerability gate (fix or categorize every vuln)
      working-directory: infrastructure
      run: |
        python3 ../scripts/vuln-gate.py --vdr vdr-report.json --register ../data/decisions.json

    # Append this run's CVE-keyed summary to the rolling vuln trend ledger
    # (RA-5(6)). Fetch the published ledger first so history persists across
    # deploys; the dashboard renders the trend from it.
    - name: Build VDR vuln trend ledger (RA-5(6))
      working-directory: infrastructure
      run: |
        if curl -sfL -o vdr-trend.json "https://samaydlette.com/.well-known/vdr-trend.json"; then
          echo "Previous VDR trend ledger fetched ($(jq '.points | length' vdr-trend.json) points)."
        else
          echo "::warning::No previous VDR trend ledger; starting a fresh one."
          rm -f vdr-trend.json
        fi
        # Merge the reconstructed history (data/vdr-trend-backfill.json) before
        # appending today. Those points were rebuilt from stored vdr-report.json
        # object versions after the sync bug reset the ledger, and they are
        # committed so the reconstruction is reviewable in a diff rather than
        # materialising from an S3 listing nobody sees. Merging here means the
        # repaired ledger is signed by the same run that builds it; uploading a
        # rebuilt ledger by hand would publish an object that disagreed with its
        # signature until the next deploy.
        #
        # Reads no AWS API, so it needs no permission the deploy role lacks, and
        # existing points always win — idempotent, a no-op once absorbed, and it
        # re-heals the ledger if it is ever reset again.
        python3 ../scripts/backfill-vdr-trend.py \
          --points ../data/vdr-trend-backfill.json --trend vdr-trend.json
        python3 ../scripts/build-vdr-trend.py --report vdr-report.json --trend vdr-trend.json
        cosign sign-blob --yes --new-bundle-format --bundle vdr-trend.bundle vdr-trend.json

    - name: Sign VDR Report
      working-directory: infrastructure
      run: |
        echo "Signing vdr-report.json with cosign keyless..."
        cosign sign-blob --yes --new-bundle-format --bundle vdr-report.bundle vdr-report.json

    # CR26 vulnerability reports in FedRAMP's 2026-06-24 shapes, from the VDR
    # report just built: VDT (VER-RPT-VDT), AVI (VER-RPT-AVI) and the history
    # (VER-TFR-MRH). Each is validated against its vendored schema before it is
    # written. The previous published copies set each report's period start and
    # carry the history forward, so they are read only if their signature
    # verifies against this workflow or the nightly (either may have published
    # them last). Absent on the first run: the period starts at the earliest
    # detection. Present but unverifiable: the build stops.
    - name: Build CR26 vulnerability reports (VDT, AVI, history)
      working-directory: infrastructure
      env:
        SITE: https://${{ vars.DOMAIN_NAME || 'samaydlette.com' }}/.well-known
      run: |
        set -euo pipefail
        prev=()
        for kind in detail-report:vdt accepted-vulnerabilities:avi history:mrh; do
          name="vdr-${kind%%:*}"; flag="--previous-${kind##*:}"
          if curl -sfL --retry 3 --retry-delay 5 -o "previous-$name.json" "$SITE/$name.json"; then
            curl -sfL --retry 3 --retry-delay 5 -o "previous-$name.bundle" "$SITE/$name.bundle"
            ok=0
            for wf in deploy-with-opa evidence-nightly; do
              if cosign verify-blob --bundle "previous-$name.bundle" \
                   --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/$wf.yml@refs/heads/main" \
                   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                   "previous-$name.json" 2>/dev/null; then ok=1; break; fi
            done
            [ "$ok" -eq 1 ] || { echo "::error::previous $name.json does not verify; refusing to carry it forward"; exit 1; }
            prev+=("$flag" "previous-$name.json")
          else
            echo "No previous $name.json published; its period starts at the earliest detection."
          fi
        done
        python3 ../scripts/build-cr26-vdr.py --vdr vdr-report.json --decisions ../data/decisions.json "${prev[@]}"
        for a in vdr-detail-report vdr-accepted-vulnerabilities vdr-history; do
          cosign sign-blob --yes --new-bundle-format --bundle "$a.bundle" "$a.json"
        done

    # -------------------------------------------------------------------------
    # PROJECT THE CANONICAL INVENTORY INTO FEDRAMP IIW (APPENDIX M) SHAPE
    # -------------------------------------------------------------------------
    # The IIW is one of several reports this codebase derives from one source.
    # The KSI signal is the wire format, the SDR carries the per-KSI and per-Rev5-
    # control record, and the IIW is the Excel-compatible shape FedRAMP processes
    # still ask for. All derive from the canonical inventory in ksi-signal.json.
    # -------------------------------------------------------------------------
    - name: Build IIW (FedRAMP SSP Appendix M)
      working-directory: infrastructure
      run: |
        echo "Projecting KSI signal into IIW shape..."
        python3 ../scripts/build-iiw.py \
          --signal ksi-signal.json \
          --output iiw.csv
        echo "IIW row count: $(($(wc -l < iiw.csv) - 1))"

    - name: Sign IIW CSV
      working-directory: infrastructure
      run: |
        echo "Signing iiw.csv with cosign keyless..."
        cosign sign-blob --yes --new-bundle-format --bundle iiw.bundle iiw.csv

    - name: Build Ongoing Certification Report (CCM)
      working-directory: infrastructure
      run: |
        echo "Building Ongoing Certification Report (CCM-OCR-AVL: quarterly human-readable summary)..."
        python3 ../scripts/build-ocr.py \
          --vdr vdr-report.json \
          --decisions ../data/decisions.json \
          --ksi-signal ksi-signal.json \
          --scn-register ../docs/scn/scn-register.csv \
          --output ongoing-certification-report.json \
          --md-output ongoing-certification-report.md
        jq '{next_ongoing_certification_report_date, next_quarterly_review_date}' ongoing-certification-report.json

    - name: Build CDS certification-data artifacts (overview, availability, policy index)
      working-directory: infrastructure
      run: |
        echo "Building CDS certification-overview package, availability feed, policy index..."
        # availability history: fetch the previously-published feed (best-effort)
        curl -sfL -o previous-availability.json "https://samaydlette.com/.well-known/availability.json" \
          || echo '{"history":[]}' > previous-availability.json
        python3 ../scripts/build-cds-overview.py \
          --offering ../data/cds/offering.json --profile ../data/system-profile.json --ksi-signal ksi-signal.json
        python3 ../scripts/build-availability.py \
          --previous previous-availability.json --ksi-signal ksi-signal.json
        python3 ../scripts/build-policy-index.py --output policy-index.json --md-output policy-index.md

    - name: Build Security Decision Record (SDR — 20x SSP replacement)
      working-directory: infrastructure
      run: |
        echo "Building Security Decision Record (SDR-CSO-FRR per KSI, SDR-CSF-CTF per Rev5 control) from the control projection..."
        curl -sfL -o previous-sdr.json "https://samaydlette.com/.well-known/security-decision-record.json" \
          || echo '{}' > previous-sdr.json
        # The nightly beacon: a nightly-stage KSI method counts only while it is
        # inside its freshness window and its signature verifies against the
        # nightly workflow. The runtime signal fetched above counts only when its
        # signature verifies. Anything else earns no credit.
        rm -f vdr-status-nightly.json vdr-status-nightly.bundle
        if curl -fsS --max-time 20 -o vdr-status-nightly.json "https://samaydlette.com/.well-known/vdr-status.json" \
          && curl -fsS --max-time 20 -o vdr-status-nightly.bundle "https://samaydlette.com/.well-known/vdr-status.bundle" \
          && cosign verify-blob --bundle vdr-status-nightly.bundle \
            --certificate-identity 'https://github.com/sam-aydlette/samaydlette.com/.github/workflows/evidence-nightly.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' vdr-status-nightly.json; then
          echo "Nightly beacon signature verified"
        else
          rm -f vdr-status-nightly.json
          echo "note: no verified nightly beacon; nightly methods earn no credit"
        fi
        python3 ../scripts/build-sdr.py \
          --catalog schemas/ksi-catalog.json --ksi-signal ksi-signal.json \
          --vdr vdr-report.json --profile ../data/system-profile.json --previous-sdr previous-sdr.json \
          --runtime-signal ksi-signal-runtime.json --vdr-status vdr-status-nightly.json \
          --ksi-short-output ksi-short.json
        # REQ-ASR-1 / T74: re-read the written SDR and fail if any assessor text
        # differs from the assessor's signed record, or a signed record is missing.
        python3 ../scripts/_assessor.py --sdr security-decision-record.json

    # The rule register may claim only what its fields support
    # (policies/compliance/claims.rego): resolving evidence, an Impractical
    # record's reasons, the operator's approval of every stand-in and scope cut,
    # and FRC-CSX-VVK checked against this build's KSI method count.
    - name: FedRAMP rule claims supported by evidence
      working-directory: infrastructure
      run: python3 ../scripts/_frr.py --claims --ksi-short ksi-short.json

    - name: Build Certification Package Overview (CPO)
      working-directory: infrastructure
      run: |
        echo "Building Certification Package Overview (CPO-CSO-OVR); with the SDR, the SSP replacement..."
        python3 ../scripts/build-cpo.py \
          --offering ../data/cds/offering.json --profile ../data/system-profile.json \
          --overview certification-overview-package.json --ksi-signal ksi-signal.json

    # The authorization-boundary map the trust center draws: the inventory's
    # components placed by docs/boundary/boundary-classification.json, connected
    # by what Terraform state says references what, with the data-flow table
    # resolved against real nodes. Generated, never drawn. Terraform state holds
    # secret values, so it is written owner-only and deleted on exit, whatever
    # happens; the map itself carries no ARN, account ID or email address (the
    # builder and invariant (l) both fail closed on one).
    - name: Build the boundary map
      working-directory: infrastructure
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        umask 077
        trap 'rm -f tfstate-main.json' EXIT
        terraform show -json > tfstate-main.json
        states=(--state tfstate-main.json)
        # The same bootstrap snapshot the inventory was built from.
        if [ -s tfstate-bootstrap.json ]; then
          states+=(--state tfstate-bootstrap.json)
        fi
        python3 ../scripts/build-boundary-graph.py \
          --ksi-signal ksi-signal.json --classification ../docs/boundary/boundary-classification.json \
          "${states[@]}" --offering ../data/cds/offering.json --vdr vdr-report.json \
          --trust-root-plan trust-root-plan.json --commit "$GITHUB_SHA" --output boundary-map.json

    # Reconciliation gate (assessment keystone, Task 1). Fails closed if any
    # cross-artifact invariant breaks: live-resource completeness (deny-by-default),
    # every VDR finding's component resolves to the inventory, every Checkov suppression is
    # categorized by an in-force decision record, every VDR finding resolves
    # to one, one identical impact level everywhere (signal, VDR, SDR, CPO, trust
    # center), the VDR, SDR and CPO bound to one signal_id, and the staged artifacts carry this run's
    # commit. Runs after all artifacts are built and signed but BEFORE anything is
    # published (Task 1.5): nothing reaches /.well-known/ until this passes, so a
    # gate failure can never leave a partial/stale served set (root of P-1).
    - name: Reconciliation gate (fail closed on drift)
      working-directory: infrastructure
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: |
        echo "Running cross-artifact reconciliation gate..."
        python3 ../scripts/reconcile.py --artifacts-dir . --live --expect-commit "$GITHUB_SHA" \
          --report reconcile-report.json

    # The trust center's data (the Authorizing Official's entry point): what needs
    # a decision, how decisions are made, and the record of those made. Built
    # after the gate so it summarizes the artifacts about to be published; it
    # fails closed if they are not bound to this build's inventory. The runtime
    # signal, the nightly beacon and the previous trust center are read from the
    # live site (the last carries the escalation-rate history forward); any that
    # cannot be read is reported as not observed, never assumed. The hand-applied
    # settings are checked live, here, with the deploy role and GITHUB_TOKEN.
    - name: Build the trust center
      working-directory: infrastructure
      env:
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'samaydlette.com' }}
        SITE: https://${{ vars.DOMAIN_NAME || 'samaydlette.com' }}/.well-known
      run: |
        set -euo pipefail
        # The hand-applied settings (GitHub, DNSSEC, the alarm subscription),
        # observed and compared with their expected values. Never fails the build.
        python3 ../scripts/check-manual-settings.py --output manual-settings.json
        fetch() { curl -fsS --max-time 20 -o "$2" "$SITE/$1" || { rm -f "$2"; echo "note: could not read $1"; }; }
        fetch ksi-signal-runtime.json runtime-observed.json
        fetch vdr-status.json vdr-status-observed.json
        fetch trust-center.json trust-center-previous.json
        # The independent corroboration (RAMPART on TAP) is run by the operator and
        # committed; it is published as committed, signed with everything else.
        if [ -f ../docs/boundary/corroboration.json ]; then cp ../docs/boundary/corroboration.json boundary-corroboration.json; fi
        python3 ../scripts/build-trust-center.py \
          --runtime runtime-observed.json --vdr-status vdr-status-observed.json \
          --previous trust-center-previous.json --manual-settings manual-settings.json \
          --corroboration boundary-corroboration.json --sdr security-decision-record.json \
          --commit "$GITHUB_SHA" --output trust-center.json

    - name: Sign Ongoing Certification Report
      working-directory: infrastructure
      run: |
        echo "Signing ongoing-certification-report.json with cosign keyless..."
        cosign sign-blob --yes --new-bundle-format --bundle ongoing-certification-report.bundle ongoing-certification-report.json

    - name: Sign CDS certification-data artifacts
      working-directory: infrastructure
      run: |
        echo "Signing CDS artifacts with cosign keyless..."
        cosign sign-blob --yes --new-bundle-format --bundle certification-overview-package.bundle certification-overview-package.json
        cosign sign-blob --yes --new-bundle-format --bundle availability.bundle availability.json
        cosign sign-blob --yes --new-bundle-format --bundle policy-index.bundle policy-index.json
        cosign sign-blob --yes --new-bundle-format --bundle security-decision-record.bundle security-decision-record.json
        cosign sign-blob --yes --new-bundle-format --bundle certification-package-overview.bundle certification-package-overview.json

    - name: Sign trust-center artifacts (boundary map, gate report, trust center)
      working-directory: infrastructure
      run: |
        cosign sign-blob --yes --new-bundle-format --bundle boundary-map.bundle boundary-map.json
        cosign sign-blob --yes --new-bundle-format --bundle reconcile-report.bundle reconcile-report.json
        cosign sign-blob --yes --new-bundle-format --bundle trust-center.bundle trust-center.json
        cosign sign-blob --yes --new-bundle-format --bundle conformance-results.bundle conformance-results.json
        if [ -f boundary-corroboration.json ]; then
          cosign sign-blob --yes --new-bundle-format --bundle boundary-corroboration.bundle boundary-corroboration.json
        fi

    # Publication redaction gate: no artifact this run is about to publish
    # carries an AWS account ID. The inventory builder redacts it
    # (scripts/_redact.py) and everything else derives from the inventory; this
    # fails closed if anything slipped past that, before a byte is uploaded.
    # It scans exactly what the next step uploads (bundles and the compiled
    # policy archive aside), never inputs this run downloaded: the live runtime
    # signal is read here but published by the runtime Lambda.
    # The list comes from the governed config (scripts/published-set.py), the
    # same one the upload step reads, so the two cannot drift apart.
    - name: Publication redaction gate (no AWS account ID)
      working-directory: infrastructure
      run: |
        files=$(python3 ../scripts/published-set.py scan --by deploy)
        # shellcheck disable=SC2086  # a word list by design
        python3 ../scripts/check-published-redaction.py $files

    # PUBLISH PHASE — every artifact was built and signed before the gate; this
    # uploads them as one block so the served /.well-known/ set is always
    # internally consistent. Nothing here runs unless the gate above passed.
    - name: Publish all signed artifacts to /.well-known/
      working-directory: infrastructure
      run: |
        BUCKET_NAME=$(terraform output -raw s3_bucket_name)
        # Every artifact the governed config (infrastructure/schemas/
        # freshness-config.json) says the deploy publishes, with its signature,
        # Markdown rendering and schema. published-set.py fails if one was not
        # built; the operator-run corroboration is the only optional one.
        objects=$(python3 ../scripts/published-set.py upload --by deploy)
        while IFS=$'\t' read -r file key type cache; do
          aws s3 cp "$file" "s3://$BUCKET_NAME/$key" --content-type "$type" --cache-control "$cache" </dev/null
        done <<< "$objects"

        # Retired artifacts (CR26): the OSCAL POA&M was replaced by the decision
        # register (data/decisions.json) on 2026-11-04, and the OSCAL SSP by the
        # SDR (per-KSI and per-Rev5-control records) and CPO on 2026-11-05. Their
        # published copies are deleted rather than left to go stale unwatched;
        # the round-trip step below asserts they are gone.
        for retired in oscal-poam.json oscal-poam.bundle oscal-poam.json.intoto.jsonl oscal-ssp.json oscal-ssp.bundle oscal-ssp.json.intoto.jsonl; do
          aws s3 rm "s3://$BUCKET_NAME/.well-known/$retired"
        done
        echo "✅ All signed artifacts published to /.well-known/ (post-gate)"

    # -------------------------------------------------------------------------
    # UPLOAD WEBSITE FILES
    # -------------------------------------------------------------------------
    # Put the actual website files on the internet. This runs after every gate,
    # so a failed gate leaves the pages and their evidence from the same deploy.
    # -------------------------------------------------------------------------
    - name: Sync Website Content
      run: |
        echo "Getting S3 bucket name from Terraform outputs..."
        cd infrastructure
        
        BUCKET_NAME=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "")

        if [ -z "$BUCKET_NAME" ]; then
          echo "❌ Could not get S3 bucket name from Terraform outputs"
          echo "Available outputs:"
          terraform output 2>/dev/null || echo "No outputs available"
          exit 1
        fi
        
        echo "✅ S3 bucket name: $BUCKET_NAME"
        echo "Syncing website content..."
        
        cd ..
        
        # Upload website files, skip infrastructure code.
        #
        # ALL of .well-known/ is EXCLUDED. Everything served from there is a
        # generated, signed artifact published by an explicit `aws s3 cp`
        # in this job — none of it is in website/, because .gitignore keeps
        # generated artifacts out of the tree. That meant `--delete` removed 48
        # published objects on every deploy and the later steps put them back
        # roughly three minutes afterwards, so a third party fetching during a
        # deploy got a 404 for the compliance artifacts and, worse, for
        # runtime-signing-pubkey.pem — the key needed to verify the runtime
        # signal. A verifiable-by-anyone system should not be unverifiable for
        # several minutes a day.
        #
        # It also subsumes the vdr-trend.json exclusion: that ledger accumulates
        # in the published object, and syncing the committed seed over it reset
        # the history on every deploy.
        #
        # Consequence: any file genuinely served from .well-known/ must be
        # published explicitly (see security.txt), exactly as
        # silk-reeling-auth.json already is. tests/test_wellknown_publish.py
        # fails if a tracked file under website/.well-known/ has no publish
        # step, so this cannot silently drop content.
        aws s3 sync website/ s3://$BUCKET_NAME/ \
          --exclude "*.tf" \
          --exclude "*.tfvars*" \
          --exclude "*.tfstate*" \
          --exclude ".terraform/*" \
          --exclude "infrastructure/*" \
          --exclude "scripts/*" \
          --exclude ".git/*" \
          --exclude "README.md" \
          --exclude "Makefile" \
          --exclude ".gitignore" \
          --exclude ".github/*" \
          --exclude ".well-known/*" \
          --delete

        # Site content that genuinely lives under .well-known/ and is committed
        # (not generated) has to be published by hand now that the sync skips
        # the whole prefix. RFC 9116 requires text/plain.
        aws s3 cp website/.well-known/security.txt "s3://$BUCKET_NAME/.well-known/security.txt" \
          --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=3600"
        echo "✅ Published /.well-known/security.txt"

        echo "✅ Website content synced successfully"

    # -------------------------------------------------------------------------
    # ATTEST ARTIFACT PROVENANCE (SLSA v1 / in-toto, DSSE — Task 14 / S2)
    # -------------------------------------------------------------------------
    # Each core compliance artifact gets a DSSE-signed SLSA provenance
    # attestation binding it to the canonical inventory (ksi-signal.json sha256 +
    # signal_id), the generator that produced it, this commit, and this run. This
    # is the cryptographic form of reconciliation invariant (e) + the publish-
    # freshness commit check: instead of string-matching the signal_id/commit, the
    # binding is a signed attestation any in-toto-aware verifier can consume. Each
    # attestation is verified here against the pinned identity, fail-closed.
    # Additive only — the artifacts and their existing .bundle signatures are
    # unchanged; this publishes new <artifact>.intoto.jsonl alongside them.
    - name: Attest artifact provenance (SLSA/in-toto)
      working-directory: infrastructure
      run: |
        BUCKET_NAME=$(terraform output -raw s3_bucket_name)
        attest() {
          art="$1"; gen="$2"
          python3 ../scripts/build-provenance.py \
            --ksi-signal ksi-signal.json --generator "../$gen" \
            --output "$art.predicate.json"
          # --new-bundle-format emits a Sigstore bundle with the DSSE envelope
          # INLINE (S3), so the in-toto Statement is decodable by any DSSE/in-toto
          # tool, not only by cosign.
          cosign attest-blob --yes --new-bundle-format \
            --predicate "$art.predicate.json" --type slsaprovenance1 \
            --bundle "$art.intoto.jsonl" "$art"
          # 1) cosign verifies the signature + identity (trust).
          cosign verify-blob-attestation --new-bundle-format \
            --bundle "$art.intoto.jsonl" --type slsaprovenance1 \
            --certificate-identity 'https://github.com/sam-aydlette/samaydlette.com/.github/workflows/deploy-with-opa.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$art"
          # 2) a dependency-free, non-cosign consumer reads the predicate and
          #    checks the bindings (subject==artifact, inventory sha256, generator,
          #    commit) - the reciprocity claim, exercised in CI, fail-closed.
          python3 ../scripts/verify-attestation.py \
            --bundle "$art.intoto.jsonl" --artifact "$art" --ksi-signal ksi-signal.json
          aws s3 cp "$art.intoto.jsonl" "s3://$BUCKET_NAME/.well-known/$art.intoto.jsonl" \
            --content-type application/json --cache-control "public, max-age=300"
          echo "  attested (inline-DSSE) + consumed + published: $art.intoto.jsonl"
        }
        # Core canonical evidence set (the SDR took the retired SSP's place). Extending
        # to the remaining CDS/CPO artifacts is one attest() line each (tracked follow-on).
        attest ksi-signal.json scripts/build-ksi-signal.py
        attest security-decision-record.json scripts/build-sdr.py
        attest vdr-report.json scripts/build-vdr-report.py
        attest iiw.csv         scripts/build-iiw.py
        echo "✅ SLSA/in-toto provenance attestations published for the core compliance artifacts"

    # Post-publish round-trip (Task 1.5 / reconciliation invariant f, live half):
    # read each artifact back from the S3 origin and confirm the served bytes
    # match what was just built and signed. Reads the origin (not CloudFront) so
    # the check is not confused by CDN caching; propagation is handled by the
    # invalidation below. Fails closed on any mismatch.
    - name: Post-publish round-trip verify
      working-directory: infrastructure
      run: |
        BUCKET_NAME=$(terraform output -raw s3_bucket_name)
        fail=0
        check() {
          want=$(sha256sum "$1" | awk '{print $1}')
          got=$(aws s3 cp "s3://$BUCKET_NAME/$2" - | sha256sum | awk '{print $1}')
          if [ "$want" != "$got" ]; then
            echo "::error::round-trip mismatch for $2 (built $want, served $got)"; fail=1
          else
            echo "ok: $2"
          fi
        }
        # Every object the upload and attest steps published, from the same list.
        served=$(python3 ../scripts/published-set.py served --by deploy)
        while IFS=$'\t' read -r file key; do
          check "$file" "$key" </dev/null
        done <<< "$served"
        # Retired artifacts must be gone from the origin. Only a 404 counts as
        # gone: any other error (e.g. AccessDenied) fails rather than passing.
        for retired in oscal-poam.json oscal-poam.bundle oscal-poam.json.intoto.jsonl oscal-ssp.json oscal-ssp.bundle oscal-ssp.json.intoto.jsonl; do
          if head_err=$(aws s3api head-object --bucket "$BUCKET_NAME" --key ".well-known/$retired" 2>&1 >/dev/null); then
            echo "::error::retired artifact still published: .well-known/$retired"; fail=1
          elif printf '%s' "$head_err" | grep -q '(404)'; then
            echo "gone: .well-known/$retired"
          else
            echo "::error::could not confirm .well-known/$retired is gone"; fail=1
          fi
        done
        if [ "$fail" -ne 0 ]; then
          echo "Post-publish round-trip FAILED — served artifacts do not match the build."; exit 1
        fi
        echo "✅ Round-trip verified: served origin matches the just-built artifacts"

    # -------------------------------------------------------------------------
    # VERIFY EVERYTHING WORKED
    # -------------------------------------------------------------------------
    # Run the monitoring function to make sure deployment was successful. It
    # re-emits the runtime signal from the inventory just published, so it runs
    # BEFORE the cache invalidation and the external verifier: the verifier reads
    # the runtime signal through the CDN, and a runtime signal emitted from the
    # previous inventory is not this deploy's evidence (it failed the
    # account-ID check on the deploy that first redacted the inventory).
    # -------------------------------------------------------------------------
    - name: Run Post-Deployment Compliance Check
      run: |
        echo "Debug: Current working directory"
        pwd
        echo "Debug: Directory contents before Lambda check"
        ls -la
        
        cd infrastructure
        
        LAMBDA_FUNCTION=$(terraform output -raw lambda_function_name 2>/dev/null || echo "")
        echo "Lambda function name: $LAMBDA_FUNCTION"
        
        cd ..
        
        # Test the monitoring function if it exists
        if [ -n "$LAMBDA_FUNCTION" ] && [ "$LAMBDA_FUNCTION" != "Not created" ]; then
          if aws lambda get-function --function-name $LAMBDA_FUNCTION >/dev/null 2>&1; then
            echo "✅ Lambda function exists, invoking..."
            aws lambda invoke \
              --function-name $LAMBDA_FUNCTION \
              --payload '{}' \
              compliance-result.json
            
            echo "Debug: Directory contents after Lambda invoke"
            ls -la
            
            if [ -f compliance-result.json ]; then
              echo "✅ compliance-result.json created successfully"
              echo "Compliance check results:"
              cat compliance-result.json | jq '.'
              
              COMPLIANT=$(cat compliance-result.json | jq -r '.body' | jq -r '.compliant // false')
              if [ "$COMPLIANT" = "true" ]; then
                echo "✅ Post-deployment compliance check passed"
              else
                echo "❌ Post-deployment compliance violations found"
                echo "::warning::Compliance violations detected in deployed infrastructure"
              fi
            else
              echo "❌ compliance-result.json was not created by Lambda invoke"
              echo '{"message":"Lambda invoke failed to create file","compliant":false}' > compliance-result.json
            fi
          else
            echo "⚠️ Lambda function not found in AWS, creating placeholder compliance result"
            echo '{"message":"Lambda function not found in AWS","compliant":true}' > compliance-result.json
          fi
        else
          echo "⚠️ Lambda function not available during initial deployment"
          echo '{"message":"Lambda function not available during initial deployment","compliant":true}' > compliance-result.json
        fi
        
        echo "Debug: Final directory contents"
        ls -la
        echo "Debug: Checking if compliance-result.json exists"
        if [ -f compliance-result.json ]; then
          echo "✅ compliance-result.json exists"
          cat compliance-result.json
        else
          echo "❌ compliance-result.json still missing"
        fi

    # -------------------------------------------------------------------------
    # REFRESH WEBSITE CACHE
    # -------------------------------------------------------------------------
    # Tell the CDN to show the new website immediately
    # -------------------------------------------------------------------------
    - name: Invalidate CloudFront Cache
      run: |
        echo "Getting CloudFront distribution ID..."
        cd infrastructure
        
        DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
        
        if [ -z "$DISTRIBUTION_ID" ]; then
          echo "❌ Could not get CloudFront distribution ID"
          echo "Available outputs:"
          terraform output 2>/dev/null || echo "No outputs available"
          exit 1
        fi
        
        echo "✅ CloudFront distribution ID: $DISTRIBUTION_ID"
        echo "Creating cache invalidation..."

        # Tell CDN to refresh all cached content. Capture the id + distribution so
        # the external-verifier smoke test can wait for this invalidation to
        # complete before checking the live edge.
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id $DISTRIBUTION_ID \
          --paths "/*" \
          --query 'Invalidation.Id' --output text)
        echo "CLOUDFRONT_DISTRIBUTION_ID=$DISTRIBUTION_ID" >> "$GITHUB_ENV"
        echo "CLOUDFRONT_INVALIDATION_ID=$INVALIDATION_ID" >> "$GITHUB_ENV"

        echo "✅ CloudFront cache invalidation created ($INVALIDATION_ID)"

    # -------------------------------------------------------------------------
    # RECIPROCITY HANDSHAKE: prove the EXTERNAL verification path still works
    # -------------------------------------------------------------------------
    # Run the same verifier a third party would (scripts/verify-published.sh)
    # against the LIVE public URL: fetch the artifacts, check the Sigstore
    # signatures + SLSA provenance against the pinned identity, and reconcile
    # them (AWS-free, invariants b–h). Waits for the invalidation above so the
    # edge is serving this deploy's artifacts. Fails closed: if an outsider could
    # not reproduce our verdict, the deploy is not done.
    - name: External verifier smoke test (reciprocity handshake)
      run: |
        echo "Waiting for CloudFront invalidation $CLOUDFRONT_INVALIDATION_ID to complete..."
        aws cloudfront wait invalidation-completed \
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
          --id "$CLOUDFRONT_INVALIDATION_ID"
        echo "Reproducing third-party verification against the live site:"
        bash scripts/verify-published.sh

    # Help debug file system issues
    - name: Debug - List files before upload
      if: always()
      run: |
        echo "Pre-upload debug:"
        pwd
        ls -la
        find . -name "*compliance*" -type f 2>/dev/null || echo "No compliance files found anywhere"
    
    # -------------------------------------------------------------------------
    # SAVE DEPLOYMENT SUMMARY
    # -------------------------------------------------------------------------
    - name: Save Deployment Outputs
      run: |
        cd infrastructure
        terraform output -json > ../deployment-outputs.json
        cd ..
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        cd infrastructure
        echo "| S3 Bucket | $(terraform output -raw s3_bucket_name) |" >> $GITHUB_STEP_SUMMARY
        echo "| CloudFront Distribution | $(terraform output -raw cloudfront_distribution_id) |" >> $GITHUB_STEP_SUMMARY
        echo "| Website URL | $(terraform output -json website_urls | jq -r '.domain // .cloudfront') |" >> $GITHUB_STEP_SUMMARY
    
    # Keep compliance results for audit records
    - name: Upload Compliance Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: compliance-report
        path: |
          compliance-result.json
          infrastructure/ksi-signal.json
          infrastructure/ksi-signal.bundle
        retention-days: 30

    # The bootstrap state snapshot (read once by "Read the trust-root state")
    # can hold secret values. Delete it whatever happened above.
    # Design principle 9: each regression goes to an owner to fix or explicitly
    # accept. It never blocks the deploy that reports it. One issue, reused.
    - name: Raise an issue for status regressions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const sdr = JSON.parse(fs.readFileSync('infrastructure/security-decision-record.json', 'utf8'));
          const items = (sdr.status_summary.regressions || {}).items || [];
          if (!items.length) { core.notice('No status regressions'); return; }
          const TITLE = 'Status regressions to fix or accept';
          const body = [
            `Commit ${context.sha} moved ${items.length} item(s) away from Implemented:`,
            '',
            ...items.map((x) => `- \`${x.id}\` (${x.kind}): ${x.from} to ${x.to}`),
            '',
            'Fix each one, or record its acceptance, then close this issue.',
          ].join('\n');
          const open = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
          });
          const match = open.find((i) => i.title === TITLE && !i.pull_request);
          if (match) {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body,
              assignees: [context.repo.owner],
            });
          }

    - name: Remove the trust-root state snapshot
      if: always()
      run: rm -f infrastructure/tfstate-bootstrap.json

  # ===========================================================================
  # JOB 3: EXTRA SECURITY SCANS
  # ===========================================================================
  # Runs additional security tools during code review to catch more issues
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # Runs on both push and pull_request so the deploy job (which only runs on
    # push to main) can consume the SARIF output as a workflow artifact and
    # feed it to the VDR aggregator.

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Scan infrastructure code for security issues
    # tfsec (end of life) cannot parse Terraform import blocks and aborts the
    # whole scan on them, which would drop every tfsec finding from the VDR.
    # They live only in infrastructure/imports.tf (one-time adoptions, no
    # security-relevant configuration); this job's checkout is scan-only, so
    # removing the file here changes nothing that is planned or applied.
    - name: Hide import blocks from tfsec
      run: rm -f infrastructure/imports.tf

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
      with:
        # Authenticate the action's "resolve latest tfsec release" GitHub API
        # call — anonymous requests get rate-limited on shared runners and the
        # step then dies with "jq: Cannot iterate over null" before scanning.
        github_token: ${{ secrets.GITHUB_TOKEN }}
        soft_fail: true
        additional_args: --format json --out tfsec-results.json

    # Another security scanner with different focus.
    # Newer versions of bridgecrewio/checkov-action treat output_file_path
    # as a directory and write the SARIF inside it (e.g. results/results_sarif.sarif).
    # We point it at a directory and locate the SARIF afterwards.
    - name: Run Checkov
      id: checkov
      uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
      with:
        directory: .
        framework: terraform
        soft_fail: true
        output_format: sarif
        output_file_path: checkov-out

    # Locate the SARIF file Checkov produced and copy it to a predictable path.
    # No empty stand-in: a scanner that produced nothing leaves no file, so the
    # upload below and the deploy's detection gate (G7) fail instead of
    # recording "no findings".
    - name: Locate SARIF and tfsec files
      if: always()
      run: |
        SARIF_FOUND=$(find checkov-out -name "*.sarif" -type f 2>/dev/null | head -n1 || true)
        if [ -n "$SARIF_FOUND" ]; then
          cp "$SARIF_FOUND" checkov-results.sarif
          echo "Located Checkov SARIF at $SARIF_FOUND, copied to checkov-results.sarif ($(wc -c < checkov-results.sarif) bytes)"
        else
          echo "::error::No SARIF produced by Checkov."
        fi
        if [ -f tfsec-results.json ]; then
          echo "tfsec JSON size: $(wc -c < tfsec-results.json) bytes"
        else
          echo "::error::No tfsec output."
        fi

    # Upload results to GitHub Security tab
    - name: Upload Checkov Results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      if: always()
      with:
        sarif_file: checkov-results.sarif

    # Share the SAST output with the deploy job so it can be ingested by the
    # VDR aggregator. The deploy job runs on push to main; the artifact is the
    # transport between the two jobs.
    - name: Upload SAST artifacts for VDR aggregation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: sast-results
        path: |
          checkov-results.sarif
          tfsec-results.json
        retention-days: 5

  # ===========================================================================
  # JOB 4: ALERT WHEN THINGS BREAK
  # ===========================================================================
  # Sends notifications and creates tickets when deployment fails
  # ===========================================================================
  # This job used to report SUCCESS while the deploy underneath it failed, and it
  # did so twelve nights running. Two defects, both fixed here:
  #
  # 1. The issue-creating step was gated on `github.event_name == 'push'`. On a
  #    scheduled run the step was SKIPPED — and a job whose only step is skipped
  #    concludes `success`. So the run summary showed a green "Notify on Failure"
  #    next to a red deploy, and no issue was ever filed. The event gate is gone;
  #    a failed deploy alerts however it was triggered.
  #
  # 2. Even when it did fire, it opened a brand-new issue every time. The
  #    repository accumulated 15+ identical open "Deployment Failed" issues,
  #    which is functionally the same as no alert: nothing distinguishes the one
  #    that matters. It now reuses a single issue, reopening and commenting, and
  #    assigns it to the repository owner so it reaches a person.
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [compliance-check, apps, deploy]
    if: always() && (needs.compliance-check.result == 'failure' || needs.apps.result == 'failure' || needs.deploy.result == 'failure')
    permissions:
      contents: read
      issues: write

    steps:
    - name: Raise or update the deployment-failure issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      # Job results reach the script through the environment rather than by
      # `${{ }}` interpolation into the script body — templating workflow context
      # straight into executable script is the habit that causes injection bugs.
      env:
        COMPLIANCE_RESULT: ${{ needs.compliance-check.result }}
        DEPLOY_RESULT: ${{ needs.deploy.result }}
      with:
        script: |
          const TITLE = `Deployment failing: ${context.workflow}`;
          const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
          const body = [
            `The deploy pipeline failed. Until it succeeds, \`main\` is not reaching production.`,
            ``,
            `| | |`,
            `|---|---|`,
            `| Run | [${context.runId}](${runUrl}) |`,
            `| Trigger | \`${context.eventName}\` |`,
            `| Commit | ${context.sha} |`,
            `| Ref | ${context.ref} |`,
            `| Compliance check | \`${process.env.COMPLIANCE_RESULT}\` |`,
            `| Deploy | \`${process.env.DEPLOY_RESULT}\` |`,
            ``,
            `Review the failing step in the run log, and the compliance reports it uploaded.`,
            ``,
            `This issue is reused rather than duplicated — each failure adds a comment. Close it once a deploy succeeds.`,
          ].join('\n');

          const existing = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'all',
            per_page: 100,
            labels: 'deploy-failure',
          });
          const match = existing.find(i => i.title === TITLE && !i.pull_request);

          if (match) {
            if (match.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, body,
            });
            core.notice(`Updated issue #${match.number}`);
          } else {
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              body,
              labels: ['deployment', 'deploy-failure', 'urgent'],
              assignees: [context.repo.owner],
            });
            core.notice(`Created issue #${created.data.number}`);
          }
