name: Agency access to the certification package
description: For a federal agency (or FedRAMP) to be put on record, to withdraw, or to ask for the access inventory. The package itself is public and needs no request.
title: "Agency access: "
labels: ["agency-access"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything in the certification package is already public** at https://samaydlette.com/trust/ and https://samaydlette.com/.well-known/trust-manifest.json; you do not need to ask to read it.
        File this form to put your agency or system **on record** (so you are counted in the access inventory and can be told about changes), to **withdraw** an earlier record, or, for FedRAMP, to **request the inventory**.
        This repository is public, so this issue is public. **Name agencies and systems, never people**; do not include names, email addresses or phone numbers. For a private request, use the security contact in `/.well-known/security.txt` instead.
        This is a proof of concept with no federal data and no agency sponsor. Procedure: docs/procedures/agency-access.md.
  - type: dropdown
    id: kind
    attributes:
      label: Request
      options:
        - Put my agency or system on record (access)
        - Withdraw an earlier record (withdrawal)
        - FedRAMP request for the access inventory (inventory-request)
    validations:
      required: true
  - type: input
    id: agency
    attributes:
      label: Agency (or FedRAMP)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System or service (optional)
  - type: input
    id: withdraws
    attributes:
      label: For a withdrawal, the earlier request (AAR-...)
