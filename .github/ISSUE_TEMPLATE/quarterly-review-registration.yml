name: Quarterly Review registration
description: Register for a Quarterly Review (CCM-QTR-REG). The operator sends the video-call link to registered parties. This is public; to register privately, use the security contact in /.well-known/security.txt.
title: "Quarterly Review registration: "
labels: ["quarterly-review-registration"]
body:
  - type: markdown
    attributes:
      value: |
        Quarterly Reviews follow each Ongoing Certification Report by 5 business days. Dates are in https://samaydlette.com/.well-known/quarterly-review.ics and in the Certification Package Overview.
        Reviews are for agencies and FedRAMP; other parties attend only with specific relevance (CCM-QTR-RTP). Registration here is public. To register privately, use the security contact in https://samaydlette.com/.well-known/security.txt.
  - type: input
    id: review
    attributes:
      label: Review date
      placeholder: "2026-12-02"
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Organization and role in relation to this offering
      description: For example, an agency considering the offering, or FedRAMP.
    validations:
      required: true
