# Dependabot configuration for supply-chain monitoring.
# Satisfies KSI-SCR-MON ("Automatically monitor third party software information
# resources for upstream vulnerabilities..."). See docs/supply-chain.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/infrastructure/lambda"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "lambda"
    commit-message:
      prefix: "deps(lambda)"
      include: "scope"

  # The accessibility scanner. Security alerts already reached this lockfile
  # (Dependabot raises those against every manifest it detects), but routine
  # version updates did not, because only configured directories get them. That
  # asymmetry is how it ended up three advisories behind on a transitive
  # dependency with nobody bumping it.
  - package-ecosystem: "npm"
    directory: "/tools/a11y"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "build-tooling"
    commit-message:
      prefix: "deps(a11y)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/infrastructure"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "infrastructure"
    commit-message:
      prefix: "deps(terraform)"
      include: "scope"
